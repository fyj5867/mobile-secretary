<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>行動祕書</title>
<meta name="description" content="整合工作與個人的行動祕書：行程、待辦、認證申請、證書效期、每日提醒與週報月報。">
<meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1B18" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="行動祕書">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=Quicksand:wght@500;600;700&display=swap">
<style>
/* Layout: a Japanese techo (手帳) — kinari graph paper, sumi ink, indigo accent, dotted washi tape and hand-drawn doodle stickers; bottom tab bar on phones */
:root{
  --bg:#F5F1E8; --grid:rgba(120,104,78,.075); --card:#FFFDF8; --card-2:#F3EEE3; --line:#E4DCCB;
  --ink:#3B3630; --sub:#776F63; --faint:#A79F8F;
  --accent:#3F5B72; --accent-tx:#3A566D; --accent-soft:#E2E9EE; --on:#FFFFFF;
  --mint:#6F9467; --mint-tx:#4D6E46; --mint-soft:#E5EDDC;
  --sun:#D2A23A; --sun-tx:#86630F; --sun-soft:#F5EBCF;
  --red:#C0533B; --red-tx:#9F3F29; --red-soft:#F4E0D7;
  --sky:#5E8FB3; --sky-tx:#3E6C8E; --sky-soft:#E1EBF2;
  --lilac:#8678B0; --lilac-tx:#625590; --lilac-soft:#EBE7F3;
  --peach:#CF8656; --leaf:#7FA36A; --teal:#5F9C8E;
  --tape-1:#D9C3A0; --tape-2:#C5D6B4; --tape-3:#BCD3E0; --tape-4:#EBD49A; --tape-5:#D4CCE6; --tape-6:#B9D6CB; --tape-ink:#3B3630;
  --doodle-ink:#4A433A; --paper-hi:rgba(255,255,255,.55);
  --shadow:0 1px 0 rgba(59,54,48,.04),0 10px 24px -18px rgba(59,54,48,.38);
  --scrim:rgba(40,34,26,.4);
  --nav-h:64px;
  --f-display:"LXGW WenKai TC","Noto Sans TC","Microsoft JhengHei","PingFang TC",serif;
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-num:"Quicksand","Noto Sans TC",system-ui,sans-serif;
  --f-seal:"Noto Serif TC","PMingLiU",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1B18; --grid:rgba(255,236,200,.035); --card:#26231F; --card-2:#2D2A25; --line:#3A352E;
    --ink:#ECE5D8; --sub:#B3A996; --faint:#857C6C;
    --accent:#8EB0C9; --accent-tx:#A9C4D8; --accent-soft:#2A3640; --on:#15202A;
    --mint:#93BD88; --mint-tx:#A9CC9F; --mint-soft:#263321;
    --sun:#E2BC63; --sun-tx:#EBCB82; --sun-soft:#3A3020;
    --red:#E08068; --red-tx:#EC9C88; --red-soft:#3D2721;
    --sky:#8DB5D3; --sky-tx:#A9C8E0; --sky-soft:#213040;
    --lilac:#A99BD2; --lilac-tx:#BFB3E0; --lilac-soft:#2D2840;
    --peach:#E0A07A; --leaf:#9CC086; --teal:#84BFB0;
    --tape-1:#9C8A6E; --tape-2:#879877; --tape-3:#7F96A3; --tape-4:#A8955F; --tape-5:#8E86A3; --tape-6:#7E9A8F; --tape-ink:#1D1B18;
    --doodle-ink:#E6DECF; --paper-hi:rgba(255,255,255,.08);
    --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 26px -18px rgba(0,0,0,.7);
    --scrim:rgba(8,6,4,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1B18; --grid:rgba(255,236,200,.035); --card:#26231F; --card-2:#2D2A25; --line:#3A352E;
  --ink:#ECE5D8; --sub:#B3A996; --faint:#857C6C;
  --accent:#8EB0C9; --accent-tx:#A9C4D8; --accent-soft:#2A3640; --on:#15202A;
  --mint:#93BD88; --mint-tx:#A9CC9F; --mint-soft:#263321;
  --sun:#E2BC63; --sun-tx:#EBCB82; --sun-soft:#3A3020;
  --red:#E08068; --red-tx:#EC9C88; --red-soft:#3D2721;
  --sky:#8DB5D3; --sky-tx:#A9C8E0; --sky-soft:#213040;
  --lilac:#A99BD2; --lilac-tx:#BFB3E0; --lilac-soft:#2D2840;
  --peach:#E0A07A; --leaf:#9CC086; --teal:#84BFB0;
  --tape-1:#9C8A6E; --tape-2:#879877; --tape-3:#7F96A3; --tape-4:#A8955F; --tape-5:#8E86A3; --tape-6:#7E9A8F; --tape-ink:#1D1B18;
  --doodle-ink:#E6DECF; --paper-hi:rgba(255,255,255,.08);
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 26px -18px rgba(0,0,0,.7);
  --scrim:rgba(8,6,4,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background-color:var(--bg);color:var(--ink);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;
  font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
}
body.locked{overflow:hidden}
[hidden]{display:none!important}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sky-tx)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--sub)}
.app{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:12px 40px}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mascot{width:48px;height:48px;flex:none}
.eyebrow{font-family:var(--f-num);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--sub)}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1.15;letter-spacing:.06em}
.tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow)}
.tab{border:0;background:transparent;padding:7px 13px;border-radius:9px;cursor:pointer;font-family:var(--f-display);font-size:14.5px;white-space:nowrap;color:var(--sub);display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .cnt{font-family:var(--f-num);font-size:11.5px;font-weight:600;background:var(--accent);color:var(--on);border-radius:999px;padding:0 6px;line-height:17px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.round{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);padding:0;flex:none}
.round svg{width:20px;height:20px}
.round[aria-current="page"]{border-color:var(--accent);color:var(--accent-tx)}
.round .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-family:var(--f-num);font-weight:600;font-size:11.5px;line-height:16px;text-align:center;border:2px solid var(--bg)}
.round.ring svg{animation:ring 2.4s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,70%,100%{transform:rotate(0)}74%{transform:rotate(14deg)}80%{transform:rotate(-12deg)}86%{transform:rotate(8deg)}92%{transform:rotate(-4deg)}}
.scope{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.scope button{border:0;background:transparent;border-radius:9px;padding:5px 12px;cursor:pointer;font-family:var(--f-display);color:var(--sub);white-space:nowrap;font-size:13.5px}
.scope button[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.add-wrap{position:relative}
.add-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45);padding:6px;min-width:240px;display:flex;flex-direction:column}
.add-menu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px 10px;border-radius:12px;cursor:pointer;text-align:left}
.add-menu button:hover{background:var(--card-2)}
.add-menu .mascot{width:36px;height:36px;flex:none}
.add-menu b{display:block;font-family:var(--f-display);font-weight:400;font-size:14.5px}
.add-menu small{color:var(--sub);font-size:12px}
.bnav,.fab{display:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 15px;cursor:pointer;font-family:var(--f-display);font-size:14px;line-height:1.25;white-space:nowrap;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--sub)}
.btn svg{width:15px;height:15px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red-tx);border-color:var(--red-soft);background:var(--red-soft)}
.btn.danger.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.ico{width:32px;height:32px;border-radius:50%;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--sub);flex:none;padding:0}
.ico:hover{background:var(--card-2);color:var(--ink)}
.ico svg{width:16px;height:16px}

/* ---------- panels & rows ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;margin:0 0 8px;flex-wrap:wrap}
.panel-h h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:17.5px;line-height:1.3;letter-spacing:.02em}
.panel-h .n{font-family:var(--f-num);font-size:13px;color:var(--sub)}
.panel-h .act{margin-left:auto}
.panel-h .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--faint));flex:none}
.sub-h{font-family:var(--f-display);font-size:13.5px;color:var(--sub);margin:10px 0 2px;display:flex;align-items:center;gap:6px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;gap:10px;padding:10px 2px;border-top:1px dashed var(--line)}
.rows > .row:first-child{border-top:0}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);background:var(--card);cursor:pointer;display:grid;place-items:center;padding:0;margin-top:0;transition:transform .15s,background .15s,border-color .15s}
.tick svg{width:15px;height:15px;opacity:0;color:var(--on)}
.tick:hover{border-color:var(--mint);transform:scale(1.08)}
.tick.on{background:var(--mint);border-color:var(--mint)}
.tick.on svg{opacity:1;color:var(--on)}
.tick[disabled]{cursor:default;transform:none}
.row-ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.row-ic svg{width:15px;height:15px}
.row-ic.k-cert{background:var(--lilac-soft);color:var(--lilac-tx)}
.row-ic.k-certday{background:var(--sun-soft);color:var(--sun-tx)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row.is-done .row-title{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--mint);text-decoration-thickness:2px}
.row-meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--sub);margin-top:2px}
.row-meta .m{display:inline-flex;align-items:center;gap:3px;overflow-wrap:anywhere}
.row-meta .m svg{width:12px;height:12px;flex:none;opacity:.8}
.row-meta .sel{user-select:all}
.row-meta a.m{color:var(--sky-tx)}
.row-note{font-size:12.5px;color:var(--sub);margin-top:4px;padding:4px 8px;border-radius:8px;background:var(--card-2);white-space:pre-wrap;overflow-wrap:anywhere}
.row .stamp{width:40px;height:40px;flex:none;margin:-6px 0 -8px}
.star{color:var(--sun);margin-right:4px}
.rep-ic{display:inline-flex;vertical-align:-2px;margin-left:4px;color:var(--sub)}
.rep-ic svg{width:13px;height:13px}
.scope-p{font-family:var(--f-display);font-size:11px;padding:0 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent-tx)}
.scope-p.s-shinnyo{background:var(--lilac-soft);color:var(--lilac-tx)}
.field input:disabled{opacity:.4}
input.time-in[aria-invalid="true"]{border-color:var(--red)!important;background:var(--red-soft)!important}
.tag{flex:none;font-family:var(--f-display);font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;margin-top:2px}
.tag.overdue{background:var(--red-soft);color:var(--red-tx)}
.tag.today{background:var(--accent-soft);color:var(--accent-tx)}
.tag.soon{background:var(--sun-soft);color:var(--sun-tx)}
.tag.later{background:var(--card-2);color:var(--sub)}
.tag.done{background:var(--mint-soft);color:var(--mint-tx)}
.tag.watch{background:var(--sky-soft);color:var(--sky-tx)}
.cat i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.app-tag{display:inline-block;font-family:var(--f-display);font-size:11.5px;line-height:1.5;padding:0 7px;border-radius:4px;margin-right:6px;vertical-align:1px;color:var(--tape-ink);background-color:var(--tape);background-image:radial-gradient(var(--paper-hi) 1px,transparent 1.5px);background-size:6px 6px}
.empty{display:flex;align-items:center;gap:12px;color:var(--sub);padding:6px 0}
.empty .mascot{width:58px;height:58px;flex:none}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:15px}
.more{font-size:12px;color:var(--sub);padding:6px 2px 0}
.link-btn{border:0;background:none;color:var(--accent-tx);cursor:pointer;font-family:var(--f-display);padding:0;font-size:13px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1.5px dashed var(--sun);border-radius:16px;padding:8px 14px;margin-bottom:14px}
.banner .mascot{width:40px;height:40px;flex:none}
.banner p{margin:0;flex:1;min-width:200px}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- today ---------- */
.hero{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 18px;align-items:center;padding:20px 20px 14px}
.hero::before{content:"";position:absolute;top:-10px;left:30px;width:112px;height:22px;transform:rotate(-4deg);background-color:var(--tape-3);background-image:radial-gradient(var(--paper-hi) 1px,transparent 1.5px);background-size:6px 6px;opacity:.9;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.hero .hero-clip{position:absolute;top:-16px;right:30px;width:30px;height:44px}
.hero-dd{display:inline-block;width:18px;height:18px;vertical-align:-4px;margin-left:6px}
.hero-dd .doodle{width:100%;height:100%}
.quote-card{position:relative;margin-top:16px;padding:22px 22px 12px}
.quote-card::before{content:"";position:absolute;top:-9px;right:64px;width:84px;height:20px;transform:rotate(3deg);background-color:var(--tape-2);background-image:radial-gradient(var(--paper-hi) 1px,transparent 1.5px);background-size:6px 6px;opacity:.9}
.quote-card .q-dd{position:absolute;right:16px;top:12px;width:30px;height:30px;transform:rotate(10deg)}
.q-head{font-family:var(--f-display);font-weight:700;font-size:15.5px;color:var(--accent-tx);letter-spacing:.06em;padding-right:40px;text-wrap:balance}
.q-text{margin-top:6px;font-family:var(--f-display);font-size:17px;line-height:32px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);background-image:linear-gradient(transparent 31px,var(--line) 31px);background-size:100% 32px;background-position:0 -1px}
.q-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--sub)}
.q-foot .link-btn{display:inline-flex;align-items:center;gap:4px}
.q-foot .link-btn svg{width:14px;height:14px}
.modal.daily{z-index:53;width:min(500px,calc(100vw - 24px));padding:0}
.daily-paper{position:relative;padding:34px 26px 4px}
.daily-paper::before{content:"";position:absolute;top:-8px;left:50%;width:110px;height:22px;transform:translateX(-50%) rotate(-2deg);background-color:var(--tape-3);background-image:radial-gradient(var(--paper-hi) 1px,transparent 1.5px);background-size:6px 6px;opacity:.92}
.daily-paper .q-date{font-family:var(--f-num);font-size:13px;color:var(--sub);margin-bottom:6px}
.daily-paper .q-head{font-size:18px}
.daily-paper .q-text{font-size:18.5px;line-height:34px;background-size:100% 34px;background-image:linear-gradient(transparent 33px,var(--line) 33px);margin:10px 0 6px}
.daily-paper .slot-foot{padding:14px 0 18px}
.daily-paper .d-dd1{position:absolute;right:22px;top:20px;width:34px;height:34px;transform:rotate(12deg)}
.daily-paper .d-dd2{position:absolute;right:58px;top:36px;width:20px;height:20px;transform:rotate(-14deg)}
.q-list{display:flex;flex-direction:column;margin-top:12px;border-top:1px dashed var(--line)}
.q-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;color:var(--sub)}
.q-item span{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.page-end{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:26px;opacity:.85}
.page-end .doodle{width:28px;height:28px}
.page-end .doodle:nth-child(odd){transform:rotate(-8deg)}
.page-end .doodle:nth-child(even){transform:rotate(7deg) translateY(4px)}
.hero > .mascot{width:72px;height:72px}
/* 精簡提醒列：問候語一行小字，不佔版面（使用者要求） */
.hello{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.35;color:var(--ink)}
.today-date{font-family:var(--f-num);color:var(--sub);font-size:12.5px;margin-top:1px}
.summary{margin-top:4px;color:var(--sub);max-width:60ch;font-size:12.5px;line-height:1.5}
.summary b{font-family:var(--f-num);color:var(--ink);font-weight:600;font-size:13px}
.next-ntf{width:250px;max-width:100%;background:var(--card-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.nn-h{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:13.5px;color:var(--sub);margin-bottom:4px}
.nn-h .doodle{width:20px;height:20px}
.nn-list{display:flex;flex-direction:column}
.nn-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:5px 0;border-top:1px dashed var(--line);font-size:12.5px}
.nn-list .nn-row:first-child{border-top:0}
.nn-t{color:var(--accent-tx);font-weight:600;white-space:nowrap}
.nn-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.nn-k{font-size:11px;color:var(--sub);white-space:nowrap}
.nn-empty{font-size:12.5px;color:var(--sub);padding:4px 0}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.mini-app{display:flex;flex-direction:column;gap:6px;padding:10px 0;border:0;border-top:1px dashed var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.mini-app:first-child{border-top:0}
.mini-top{display:flex;align-items:center;gap:8px;min-width:0}
.mini-top .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.mini-top .left{font-family:var(--f-num);font-size:12.5px;color:var(--sub);white-space:nowrap}
.mini-next{font-size:12.5px;color:var(--sub)}
.prog{height:8px;border-radius:4px;background:var(--card-2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;border-radius:4px;background:var(--mint)}

/* ---------- agenda ---------- */
.ag-day{margin-bottom:14px}
.ag-head{display:flex;align-items:baseline;gap:8px;padding:0 4px 6px}
.ag-head b{font-family:var(--f-display);font-weight:400;font-size:16px}
.ag-head span{font-size:12.5px;color:var(--sub)}
.ag-day .panel{padding:4px 16px}
.chk-inline{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13.5px}
.chk-inline input{width:17px;height:17px;accent-color:var(--accent)}

/* ---------- calendar ---------- */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .grow{flex:1}
.month-title{font-family:var(--f-display);font-size:22px;min-width:130px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:22px;height:9px;border-radius:3px;background-color:var(--tape-1);background-image:radial-gradient(var(--paper-hi) 1px,transparent 1.5px);background-size:6px 6px}
.legend svg{width:13px;height:13px}
.cal{--dh:30px;--lh:20px;--ch:58px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--card-2)}
.cal-head div{padding:7px 8px;font-family:var(--f-display);font-size:13px;color:var(--sub)}
.cal-head div.sat,.dnum.sat{color:var(--sky-tx)}
.cal-head div.sun,.dnum.sun{color:var(--red-tx)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.dbg{grid-row:1/-1;border:0;border-left:1px solid var(--line);background:transparent;cursor:pointer;padding:0;min-width:0;border-radius:0}
.dbg.c1{border-left:0}
.dbg:hover{background:var(--card-2)}
.dbg.out{background:var(--card-2)}
.dbg.is-today{background:var(--accent-soft)}
.dbg.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dbg:focus-visible{outline-offset:-3px}
.dnum{grid-row:1;z-index:1;pointer-events:none;padding:5px 8px 0;font-family:var(--f-num);font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:6px;min-width:0}
.dnum.out{color:var(--faint)}
.dnum .tdot{font-family:var(--f-display);font-size:10.5px;font-weight:400;background:var(--accent);color:var(--on);border-radius:999px;padding:0 6px;line-height:16px}
.band{z-index:2;margin:2px 0;border:0;padding:0 7px;font-family:var(--f-display);font-size:11.5px;line-height:1;color:var(--tape-ink);background-color:var(--tape);background-image:radial-gradient(var(--paper-hi) 1px,transparent 1.5px);background-size:6px 6px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;cursor:pointer;min-width:0;text-align:left;border-radius:0}
.band.rs{margin-left:5px;border-top-left-radius:8px;border-bottom-left-radius:8px}
.band.re{margin-right:5px;border-top-right-radius:8px;border-bottom-right-radius:8px}
.band span{overflow:hidden;text-overflow:ellipsis}
.band svg{width:12px;height:12px;flex:none}
.band .end{margin-left:auto}
.band.st-paused,.band.st-cancelled{filter:grayscale(1);opacity:.55}
.dchips{display:flex;flex-direction:column;gap:3px;padding:3px 5px 7px;min-width:0;pointer-events:none;z-index:1}
.chip{display:flex;align-items:center;gap:4px;font-size:11.5px;line-height:1.4;padding:1px 6px 1px 5px;border-radius:6px;background:var(--card-2);color:var(--ink);overflow:hidden;white-space:nowrap;min-width:0}
.chip i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip .ic{flex:none;display:grid}
.chip .ic svg{width:11px;height:11px}
.chip .ct{overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip b{font-family:var(--f-num);font-weight:500}
.chip.k-step,.chip.k-certday{background:var(--c);color:var(--tape-ink)}
.chip.k-cert{background:var(--lilac-soft);color:var(--lilac-tx)}
.chip.done{opacity:.5;text-decoration:line-through}
.chip.l-overdue{box-shadow:inset 0 0 0 1.5px var(--red)}
.chip.l-soon,.chip.l-today{box-shadow:inset 0 0 0 1.5px var(--sun)}
.chip.more-chip{background:transparent;color:var(--sub);padding-left:2px}
.daypanel .period{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:10px;background:var(--card-2);margin-bottom:6px}
.tape-sw{width:20px;height:10px;border-radius:3px;flex:none;background-color:var(--tape);background-image:radial-gradient(var(--paper-hi) 1px,transparent 1.5px);background-size:6px 6px}

/* ---------- certification ---------- */
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 13px;cursor:pointer;font-family:var(--f-display);color:var(--sub);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .c{font-family:var(--f-num);font-size:12px;margin-left:3px}
.apps-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,500px),1fr));gap:22px 18px;padding-top:8px}
.app-card{position:relative;padding-top:22px}
.app-card::before{content:"";position:absolute;top:-9px;left:24px;width:96px;height:22px;transform:rotate(-3deg);border-radius:2px;opacity:.95;background-color:var(--tape);background-image:radial-gradient(var(--paper-hi) 1px,transparent 1.5px);background-size:6px 6px}
.app-head{display:flex;align-items:flex-start;gap:10px}
.app-head .mascot{width:54px;height:54px;flex:none;margin-top:-6px}
.app-head .ttl{flex:1;min-width:0}
.app-name{font-family:var(--f-display);font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.app-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.scheme{font-family:var(--f-num);font-size:12px;font-weight:600;border:1.5px solid var(--ink);border-radius:6px;padding:0 6px;line-height:18px}
.app-meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--sub);font-size:12.5px;margin-top:10px}
.app-meta .m{display:inline-flex;align-items:center;gap:4px;overflow-wrap:anywhere}
.app-meta svg{width:13px;height:13px;flex:none}
.tl{margin:18px 0 4px}
.tl-track{position:relative;height:16px;border-radius:8px;background:var(--card-2);border:1px solid var(--line)}
.tl-fill{position:absolute;top:0;bottom:0;left:0;border-radius:8px;background-color:var(--tape);background-image:radial-gradient(var(--paper-hi) 1px,transparent 1.5px);background-size:6px 6px}
.tl-dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2.5px solid var(--card);background:var(--faint);z-index:1}
.tl-dot.done{background:var(--mint)}
.tl-dot.overdue{background:var(--red)}
.tl-dot.soon,.tl-dot.today{background:var(--sun)}
.tl-now{position:absolute;top:-7px;bottom:-7px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px;z-index:2}
.tl-now::after{content:"今天";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-size:10.5px;color:var(--ink);white-space:nowrap}
.tl-labels{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
.tl-labels b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.app-prog{display:flex;align-items:center;gap:10px;margin:12px 0 2px;font-size:13px}
.app-prog .prog{flex:1}
.app-prog b{font-family:var(--f-num);font-weight:600}
.stickers{display:flex;gap:2px;flex-wrap:wrap}
.stickers .stamp{width:26px;height:26px}
.stickers .pend{width:26px;height:26px;display:grid;place-items:center}
.stickers .pend i{width:12px;height:12px;border-radius:50%;border:2px dashed var(--faint)}
.app-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.app-note{font-size:12.5px;color:var(--sub);margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);min-width:0}
.tile .mascot{width:46px;height:46px;flex:none}
.tile .v{font-family:var(--f-num);font-size:27px;font-weight:600;line-height:1.05}
.tile .l{font-size:12.5px;color:var(--sub)}
.tile.t-red .v{color:var(--red-tx)}
.tile.t-sun .v{color:var(--sun-tx)}
.tile.t-sky .v{color:var(--sky-tx)}
.tile.t-mint .v{color:var(--mint-tx)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 14px;min-width:0;flex:1;max-width:380px;box-shadow:var(--shadow)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.search svg{width:16px;height:16px;color:var(--sub);flex:none}
.cert-group{margin-bottom:16px;padding:0;overflow:hidden}
.cert-group .panel-h{padding:12px 18px 10px;margin:0;border-bottom:1px solid var(--line)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;color:var(--sub);font-weight:500;padding:8px 14px;background:var(--card-2);white-space:nowrap}
td{padding:8px 14px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
td.wrap{white-space:normal;min-width:140px;color:var(--sub);font-size:12.5px}
tbody tr:hover td{background:var(--card-2)}
td.proj{font-weight:700}

/* ---------- report ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12.5px;color:var(--sub)}
.kpi .v{font-family:var(--f-num);font-size:28px;font-weight:600;line-height:1.15}
.kpi .v small{font-size:14px;color:var(--sub);font-weight:500;margin-left:3px}
.kpi .s{font-size:12px;color:var(--sub)}
.chart-box{overflow-x:auto}
.chart-svg{width:100%;height:auto;display:block}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--sub);font-family:var(--f-num);font-size:11px}
.ax.sm{font-size:10px}
.ax.now{fill:var(--accent-tx);font-weight:600}
.b-done{fill:var(--mint)}
.b-open{fill:var(--sun)}
.b-open.late{fill:var(--red)}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.catbars{display:flex;flex-direction:column;gap:8px}
.catbar{display:grid;grid-template-columns:84px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.catbar .trk{height:12px;border-radius:6px;background:var(--card-2);overflow:hidden;display:flex;border:1px solid var(--line)}
.catbar .trk i{display:block;height:100%}
.catbar .c{font-family:var(--f-num);color:var(--sub);text-align:right}
.rep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}

/* ---------- settings ---------- */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.set-grid .panel p{margin:0 0 10px;color:var(--sub)}
.set-acts{display:flex;flex-wrap:wrap;gap:8px}
.set-list{margin:0;padding-left:20px;color:var(--sub)}
.set-list li{margin-bottom:4px}
.stat-line{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--sub);margin-bottom:10px}
.stat-line b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.excel-note{display:flex;align-items:center;gap:6px;margin:-4px 0 14px;font-size:12.5px;color:var(--sub)}
.excel-note b{color:var(--ink);font-weight:500}
.diff-list{list-style:none;margin:0 0 6px;padding:0;border-top:1px dashed var(--line)}
.diff-list li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:6px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.diff-list li .num{margin-left:auto;color:var(--accent-tx);white-space:nowrap}
.file-btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.set-grid .span2{grid-column:1/-1}
.sync-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sync-row input{flex:1;min-width:220px;background:var(--card-2);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;outline:0;font-size:16px}
.sync-row input:focus{border-color:var(--accent)}
.round .sdot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--mint);border:2px solid var(--bg)}
.round .sdot.busy{background:var(--sun)}
.round .sdot.err{background:var(--red)}
.pair-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-bottom:10px}
.qr-box{width:200px;min-height:200px;display:grid;place-items:center;background:#fff;border-radius:16px;padding:8px;color:#5F6782;font-size:12.5px;text-align:center}
.qr-box img{width:184px;height:184px;image-rendering:pixelated}
@media (max-width:560px){.pair-grid{grid-template-columns:minmax(0,1fr)}.qr-box{margin:0 auto}}

/* ---------- layers ---------- */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:45;backdrop-filter:blur(2px)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,calc(100vw - 24px));max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);border-radius:24px;box-shadow:0 30px 80px -24px rgba(0,0,0,.5);z-index:55;padding:20px 22px;animation:rise .22s ease-out;overscroll-behavior:contain}
@keyframes rise{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
.sheet-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sheet-h .mascot{width:56px;height:56px;flex:none}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:21px}
.sheet-h p{margin:2px 0 0;color:var(--sub);font-size:13px}
.sheet-h .x{margin-left:auto;align-self:flex-start}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.fsec{grid-column:1/-1;font-family:var(--f-display);font-size:14px;color:var(--accent-tx);margin-top:6px;display:flex;align-items:center;gap:8px}
.fsec::after{content:"";flex:1;height:1px;background:var(--line)}
.field{min-width:0}
.field > label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea{width:100%;background:var(--card-2);border:1.5px solid var(--line);border-radius:12px;padding:8px 11px;outline:0;min-width:0;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:12px;color:var(--faint);margin-top:3px}
.wd-hint{font-family:var(--f-display);font-size:13.5px;color:var(--accent-tx);margin-top:4px;padding-left:4px}
.wd-hint:empty{display:none}
.se-dwrap{display:flex;flex-direction:column;gap:1px;min-width:0}
.se-dwrap .wd-hint{font-size:11.5px;margin-top:0}
.req{color:var(--accent-tx)}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-top:22px}
.checks label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin:0;color:var(--ink);font-size:14px}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.radio-seg{display:flex;gap:6px}
.radio-seg label{flex:1;cursor:pointer;margin:0}
.radio-seg input{position:absolute;opacity:0;pointer-events:none}
.radio-seg span{display:block;text-align:center;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card-2);font-family:var(--f-display)}
.radio-seg input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-tx)}
.radio-seg input:focus-visible + span{outline:2.5px solid var(--accent);outline-offset:2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer;margin:0}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches span{display:block;width:40px;height:24px;border-radius:5px;border:2px solid transparent;background-color:var(--tape);background-image:radial-gradient(var(--paper-hi) 1px,transparent 1.5px);background-size:6px 6px}
.swatches input:checked + span{border-color:var(--ink);transform:rotate(-4deg)}
.swatches input:focus-visible + span{outline:2.5px solid var(--accent);outline-offset:2px}
.steps-ed{display:flex;flex-direction:column;gap:8px}
.step-ed{display:grid;grid-template-columns:150px 110px minmax(0,1fr) auto auto;gap:6px;align-items:center;background:var(--card-2);border-radius:12px;padding:6px}
.step-ed input:not([type=checkbox]){background:var(--card)!important;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;min-width:0;font-size:15px}
.step-ed .dn{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--sub);white-space:nowrap}
.step-ed .dn input{width:17px;height:17px;accent-color:var(--mint)}
.steps-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.form-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.form-foot .left{margin-right:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);background:var(--bg);z-index:50;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:-24px 0 60px -30px rgba(0,0,0,.55);animation:slide .25s ease-out;overscroll-behavior:contain}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drawer .panel{margin-bottom:14px}
.slot-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px;flex-wrap:wrap}

/* ---------- toasts & celebration ---------- */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--mint);border-radius:12px;padding:8px 16px 8px 12px;box-shadow:0 14px 30px -14px rgba(59,54,48,.55);animation:tin .3s ease-out;max-width:420px;font-size:13.5px}
.toast .mascot{width:40px;height:40px;flex:none}
.toast.out{opacity:0;transform:translateY(8px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.pop{position:fixed;z-index:80;width:96px;height:96px;margin:-48px 0 0 -48px;pointer-events:none}
.pop .stamp{width:96px;height:96px;animation:stampin 1.15s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes stampin{0%{transform:scale(.2) rotate(-40deg);opacity:0}22%{transform:scale(1.18) rotate(4deg);opacity:1}38%{transform:scale(1) rotate(0)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-26px) scale(.9)}}
.cf{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;animation:cf .9s ease-out forwards}

const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };

function plain(e) {

function reportText() {
  const D = reportData(); const R = D.R; const L = [];
  const list = (arr, empty) => arr.length ? arr.map((e, i) => `  ${i + 1}. ${plain(e)}`) : [`  （${empty}）`];
  L.push(`【${scopeWord()}${R.title}】${R.label}`);
  L.push(`完成率 ${D.rate}%（完成 ${D.done.length}／共 ${D.work.length} 件，未完成 ${D.open.length} 件，其中已過期 ${D.late.length} 件）`, '');
  L.push('一、本期完成', ...list(D.done, '無'), '');

  let n = 3; const cn = ['', '一', '二', '三', '四', '五', '六'];
  if (D.showWork) {
    L.push(`${cn[n++]}、認證申請進度`);
    if (D.activeApps.length) D.activeApps.forEach(a => { const st = a.steps || []; const e = endOf(a); const l = isDate(e) ? diff(TODAY, e) : null; L.push(`  - ${appName(a)}${a.scheme ? `（${a.scheme}）` : ''}：節點 ${st.filter(s => s.done).length}/${st.length} 完成，預計取證 ${isDate(e) ? e.replace(/-/g, '/') : '未定'}${l == null ? '' : l >= 0 ? `（剩 ${l} 天）` : `（已過 ${-l} 天）`}`); });
    else L.push('  （無進行中申請）');
    if (D.gotApps.length) L.push(`  本期取證：${D.gotApps.map(appName).join('、')}`);

  if (D.showWork) {
    L.push(`${cn[n++]}、證書到期提醒（期末起 90 天內）`);
    if (D.certSoon.length) D.certSoon.forEach(c => { const d = diff(TODAY, c.due); L.push(`  - ${c.project}｜${c.cert}：${c.due.replace(/-/g, '/')}（${d < 0 ? `已過期 ${-d} 天` : `剩 ${d} 天`}）${c.state === 'renewing' ? ' 續證中' : ''}`); });

function reportCSV() {

  return `<div class="nn-list">${ups.map(x => `<div class="nn-row"><span class="nn-t num">${fmtAt(x.n.at)}</span><span class="nn-n">${esc(noticeName(x.e))}</span><span class="nn-k">${x.n.kind === 'day' ? '前一天' : (x.e.time && !x.e.allDay ? '2 小時前' : '當天')}</span></div>`).join('')}</div>`;

function checkNotices() {
  let sent = {}; try { sent = JSON.parse(ls.get(NTF_KEY)) || {}; } catch (e) { sent = {}; }
  const now = Date.now(), lo = addDays(TODAY, -1), hi = addDays(TODAY, 2), due = [];

function downloadFile(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function shareOrDownload(filename, text, type) {
  try {
    if (navigator.canShare && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const file = new File([text], filename, { type });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return; }
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  downloadFile(filename, text, type);
}

const validId = s => typeof s === 'string' && /^[\w.-]{1,80}$/.test(s);
function cleanDocs(arr) { return Array.isArray(arr) ? arr.filter(x => x && typeof x === 'object' && validId(x.id)) : []; }

/* ===== 從《TWINHEAD 安規認證到期管理》Excel 更新證書效期（單向：Excel 是主資料） =====
   讀「到期提醒總覽」工作表：標題列含「機型」「到期日」；到期日是公式，讀 Excel 存檔時的計算結果。
   以「機型＋認證項目」比對；App 裡的續證狀態、證書編號、備註保留。新證書的 id 由比對鍵雜湊而來，多台裝置匯入不會重複。 */
const XLSX_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const normTxt = v => String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
const certKey = (p, c) => normTxt(p).toUpperCase() + '|' + normTxt(c).toUpperCase();
const hashId = s => { let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.codePointAt(0)) >>> 0; return 'tw' + h.toString(36); };
function excelDate(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  if (v instanceof Date) return ymd(v);
  const m = String(v).match(/(\d{4})\s*[\/.\-年]\s*(\d{1,2})\s*[\/.\-月]\s*(\d{1,2})/);
  return m ? `${m[1]}-${pad(+m[2])}-${pad(+m[3])}` : '';
}
async function readReviewWorkbook(file) {
  if (!window.XLSX) await loadScript(XLSX_LIB);
  const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const sheet = wb.SheetNames.find(n => n.includes('到期提醒總覽')) || wb.SheetNames.find(n => n.includes('到期'));
  if (!sheet) throw new Error('nosheet');
  const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[sheet], { header: 1, raw: true, defval: '' });
  const hi = rows.findIndex(r => r.some(c => String(c).includes('機型')) && r.some(c => String(c).includes('到期日')));
  if (hi < 0) throw new Error('noheader');
  const H = rows[hi].map(c => String(c));
  const col = re => H.findIndex(h => re.test(h));
  const cP = col(/機型/), cC = col(/認證|憑證/), cD = col(/到期日/), cN = col(/備註|計算依據/);
  const out = [];
  rows.slice(hi + 1).forEach(r => {
    const project = normTxt(r[cP]), cert = normTxt(r[cC]);
    if (project && cert) out.push({ project, cert, due: excelDate(r[cD]), note: cN >= 0 ? normTxt(r[cN]) : '' });
  });
  return { sheet, rows: out };
}
function certDiff(rows) {
  const byKey = new Map(S.certs.map(c => [certKey(c.project, c.cert), c]));
  const seen = new Set(), added = [], changed = [], skipped = [];
  let same = 0;
  rows.forEach(r => {
    if (!isDate(r.due)) { skipped.push(r); return; }
    const k = certKey(r.project, r.cert);
    if (seen.has(k)) return; seen.add(k);
    const c = byKey.get(k);
    if (!c) added.push(r); else if (c.due !== r.due) changed.push({ c, r }); else same++;
  });
  skipped.forEach(r => seen.add(certKey(r.project, r.cert)));
  const missing = S.certs.filter(c => !c.sample && (c.state || 'normal') !== 'retired' && !seen.has(certKey(c.project, c.cert)));
  return { added, changed, same, skipped, missing };
}

function applyCertDiff() {
  const d = UI.certDiff; if (!d) return;
  const now = iso();
  d.added.forEach(r => {
    const id = hashId(certKey(r.project, r.cert));
    const doc = { id, project: r.project, cert: r.cert, due: r.due, no: '', state: 'normal', note: r.note, src: 'excel', updatedAt: now };
    const i = S.certs.findIndex(c => c.id === id);
    if (i < 0) S.certs.push(doc); else S.certs[i] = Object.assign({}, S.certs[i], doc);
  });
  d.changed.forEach(({ c, r }) => {
    // 到期日往後延，代表續證完成：續證中 → 追蹤中
    if (c.state === 'renewing' && r.due > c.due) c.state = 'normal';
    c.due = r.due; if (!c.note && r.note) c.note = r.note; c.updatedAt = now;

  try { await navigator.clipboard.writeText(text); toast(okMsg, 'happy', 'mint', 'check'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (er) {}
    ta.remove(); toast(ok ? okMsg : '無法自動複製，請長按選取後複製', ok ? 'happy' : 'worried', ok ? 'mint' : 'sun');
  }
}
/* 行事曆訂閱內容：過去 60 天～未來 400 天；只放標題、時間、地點、類別 */
function buildFeed() {
  const lo = addDays(TODAY, -60), hi = addDays(TODAY, 400);
  const evs = [];
  const url = location.protocol.startsWith('http') ? location.origin + location.pathname : '';
  for (const it of S.items) {
    if (!isDate(it.date)) continue;
    const sc = it.scope || 'work';
    const pre = (sc === 'personal' ? '' : `【${scopeOf(sc).t}】`) + (it.star ? '★' : '');
    const time = it.allDay ? '' : (it.time || ''), endTime = it.allDay ? '' : (it.endTime || '');
    const base = { desc: `${scopeOf(sc).t}・${it.cat || '其他'}`, location: it.location, url };
    if (isRep(it)) {
      if (isDate(it.until) && it.until < lo) continue;
      const freq = { daily: 'FREQ=DAILY', weekdays: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly: 'FREQ=WEEKLY', monthly: 'FREQ=MONTHLY', yearly: 'FREQ=YEARLY' }[it.repeat];
      if (!freq) continue;
      const rr = freq + (isDate(it.until) ? `;UNTIL=${icsDate(it.until)}T235959` : '');
      const al = alarmsFor(time, it.repeat);
      evs.push(vevent(Object.assign({ uid: 'item-' + it.id, date: it.date, time, endTime, summary: pre + it.title, rrule: rr, alarms: al }, base)));
    } else {
      if (it.date < lo || it.date > hi) continue;
      const future = it.date >= TODAY && !it.done;
      evs.push(vevent(Object.assign({ uid: 'item-' + it.id, date: it.date, time, endTime, summary: (it.done ? '✓ ' : '') + pre + it.title, alarms: future ? alarmsFor(time) : [] }, base)));
    }
  }
  for (const a of S.apps) {
    if (a.status === 'cancelled') continue;
    const live = isLive(a);
    (a.steps || []).forEach(st => {
      if (!isDate(st.date) || st.date < lo || st.date > hi) return;
      const future = live && !st.done && st.date >= TODAY;
      evs.push(vevent({ uid: `step-${a.id}-${st.id}`, date: st.date, time: st.time, summary: `${st.done ? '✓ ' : ''}【認證】${appName(a)}｜${st.title}`, desc: '認證提交節點', url, alarms: future ? alarmsFor(st.time) : [] }));
    });
    const cd = endOf(a);
    if (isDate(cd) && cd >= lo && cd <= hi) evs.push(vevent({ uid: 'certday-' + a.id, date: cd, summary: `${a.status === 'obtained' ? '【取證】' : '【預計取證】'}${appName(a)}`, url, alarms: live && cd >= TODAY ? alarmsFor('') : [] }));
  }
  for (const c of S.certs) {
    if (!isDate(c.due) || certLvl(c) === 'retired' || c.due < lo) continue;
    evs.push(vevent({ uid: 'cert-' + c.id, date: c.due, summary: `【證書到期】${c.project}｜${c.cert}`, url, alarms: c.due >= TODAY ? ['-P89DT15H', '-P29DT15H', '-P1DT15H'] : [] }));
  }
  return icsWrap(evs, '行動祕書', true);
}

/* ================= actions ================= */
function findByKey(key) {
  const [k, a, b] = key.split(':');
  if (k === 'item') return { k, it: S.items.find(x => x.id === a), date: b };
  if (k === 'step' || k === 'certday' || k === 'app') return { k, app: S.apps.find(x => x.id === a), stepId: b };
  if (k === 'cert') return { k, cert: S.certs.find(x => x.id === a) };
  return { k };
}
function openEdit(key) {
  const f = findByKey(key);
  if (f.k === 'item' && f.it) openItemForm(f.it);
  else if (f.app) openAppForm(f.app);
  else if (f.k === 'cert' && f.cert) openCertForm(f.cert);
}
function todayPendingCount() { return EV.filter(e => e.date === TODAY && e.k !== 'cert' && e.live && !e.done).length; }
function toggle(btn) {
  const f = findByKey(btn.dataset.key);
  if (f.k === 'item' && f.it) {
    const it = f.it;
    if (isRep(it)) {
      const d = f.date; const dd = Object.assign({}, it.doneDates || {}); const done = !dd[d];
      const lastToday = done && d === TODAY && todayPendingCount() === 1;
      if (done) { dd[d] = iso(); celebrate(btn, it.title); } else delete dd[d];
      Store.patch('items', it.id, { doneDates: dd });
      if (lastToday) setTimeout(() => toast('今日待辦全部完成！給自己一個大大的讚', 'happy', 'mint', 'cert'), 900);
      return;
    }
    const done = !it.done;
    const lastToday = done && it.date === TODAY && todayPendingCount() === 1;
    if (done) celebrate(btn, it.title);
    Store.patch('items', it.id, { done, doneAt: done ? iso() : null });
    if (lastToday) setTimeout(() => toast('今日待辦全部完成！給自己一個大大的讚', 'happy', 'mint', 'cert'), 900);
  } else if (f.k === 'step' && f.app) {
    const a = f.app; const st = (a.steps || []).find(s => s.id === f.stepId); if (!st) return;
    const done = !st.done;
    const lastToday = done && st.date === TODAY && todayPendingCount() === 1;
    const steps = (a.steps || []).map(s => s.id === f.stepId ? Object.assign({}, s, { done, doneAt: done ? iso() : null }) : Object.assign({}, s));
    if (done) celebrate(btn, `${appName(a)}｜${st.title}`);
    Store.patch('apps', a.id, { steps, updatedAt: iso() });
    if (done && steps.every(s => s.done)) setTimeout(() => toast(`「${appName(a)}」所有提交節點都完成了，就等取證！`, 'happy', 'pink', 'cert'), 900);
    else if (lastToday) setTimeout(() => toast('今日待辦全部完成！給自己一個大大的讚', 'happy', 'mint', 'cert'), 900);
  }
}
function arm(btn, armedText, fn) {
  if (!btn.classList.contains('armed')) {
    const t = btn.textContent; btn.classList.add('armed'); btn.textContent = armedText;
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = t; } }, 3500);
    return;
  }
  fn();
}
function doDelete(btn) {
  arm(btn, '再按一次確認刪除', () => {
    const [k, id] = btn.dataset.key.split(':');
    const col = k === 'item' ? 'items' : k === 'app' ? 'apps' : 'certs';
    Store.del(col, id); closeLayer($('#modal')); toast('已刪除', 'calm', 'sky');

}
function clearSamples(btn) {
  arm(btn, '確定清除？再按一次', () => {

function clearAll(btn) {

}

function insertTemplate() {
  const box = $('#fa-steps');

  'import-replace': b => arm(b, '確定取代？再按一次', () => applyImport('replace')),

  notify: () => enableNotify(),
  install: async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; render(); },

};
// 文字拆成段落：每段以「-」開頭（使用者 Word 檔的格式），或段落之間空一行
function splitPassages(raw) {
  const clean = String(raw || '').replace(/\r/g, '');
  const dashed = (clean.match(/^[ \t　]*-/gm) || []).length >= 2;
  return (dashed ? clean.split(/^[ \t　]*-+[ \t　]*/m) : clean.split(/\n[ \t　]*\n+/))
    .map(s => s.replace(/\n{3,}/g, '\n\n').trim().replace(/\{/g, '「').replace(/\}/g, '」')).filter(Boolean);
}
// 存進使用者自己的資料（不寫進程式碼），之後每天 0:00 由 quoteOf() 自動抽一篇
function addQuoteTexts(parts, showToday) {
  const have = new Set(S.quotes.map(q => (q.text || '').trim()));
  const fresh = Array.from(new Set(parts)).filter(t => !have.has(t));
  const now = iso();
  fresh.forEach((text, i) => S.quotes.push({ id: uid('q') + i, text, updatedAt: now }));
  const key = `msec.daily:${TODAY}`; shownDaily.add(key); ls.set(key, '1');
  commit();
  if (showToday && fresh.length) openDaily();
  toast(fresh.length ? `已載入 ${fresh.length} 篇${parts.length > fresh.length ? `（${parts.length - fresh.length} 篇重複，略過）` : ''}，之後每天 0:00 自動換一篇` : '這些段落都已經載入過了', 'happy', 'mint', 'check');
}
function addQuotes() {
  const parts = splitPassages(($('#quoteBulk') || {}).value || '');
  if (!parts.length) { toast('請先貼上段落', 'worried', 'sun'); return; }
  UI.quoteBulk = '';
  addQuoteTexts(parts, false);
}
/* 直接讀使用者的 Word 檔（.docx）或段落檔（.json）。docx 是 zip，取 word/document.xml 的段落文字 */
const JSZIP_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
async function docxText(file) {
  if (!window.JSZip) await loadScript(JSZIP_LIB);
  const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
  const doc = zip.file('word/document.xml');
  if (!doc) throw new Error('notdocx');
  const xml = await doc.async('string');
  const unesc = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
  return Array.from(xml.matchAll(/<w:p[ >][\s\S]*?<\/w:p>/g)).map(m => {
    let t = '';
    for (const r of m[0].matchAll(/<w:t(?: [^>]*)?>([\s\S]*?)<\/w:t>|<w:tab\/>|<w:br\/>/g)) t += r[1] !== undefined ? unesc(r[1]) : (r[0] === '<w:tab/>' ? ' ' : '\n');
    return t.replace(/ /g, ' ').trim();
  }).join('\n');
}
async function handleQuoteFile(file) {
  if (!file) return;
  let parts = [];
  try {
    if (/\.docx$/i.test(file.name)) parts = splitPassages(await docxText(file));
    else {
      const d = JSON.parse((await file.text()).replace(/^﻿/, ''));
      const list = Array.isArray(d) ? d : (d.quotes || []);
      parts = list.map(q => normTxtKeepLines(typeof q === 'string' ? q : q && q.text)).filter(Boolean);
    }
  } catch (e) { toast('讀不懂這個檔案，請選《這時候，深呼吸》的 Word 檔（.docx）', 'worried', 'coral'); return; }
  if (!parts.length) { toast('檔案裡找不到段落', 'worried', 'sun'); return; }
  addQuoteTexts(parts, true);
}
const normTxtKeepLines = s => String(s || '').replace(/\r/g, '').replace(/\n{3,}/g, '\n\n').trim();

else setTimeout(() => { maybeDaily(); checkNotices(); }, 900);

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
