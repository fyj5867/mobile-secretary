<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>行動祕書</title>
<meta name="description" content="整合工作與個人的行動祕書：行程、待辦、認證申請、證書效期、每日提醒與週報月報。">
<meta name="theme-color" content="#F4F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1A18" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="行動祕書">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* Layout: MUJI-like — plain unbleached paper, charcoal ink, flat cards with thin lines, a little deep red (--brand); bottom tab bar on phones */
:root{
  --bg:#F4F2EE; --card:#FBFAF8; --card-2:#F0EDE8; --line:#E1DDD6;
  --ink:#2F2E2C; --sub:#75716A; --faint:#A8A39A;
  --accent:#3B3936; --accent-tx:#3B3936; --accent-soft:#E9E5DE; --on:#FFFFFF; --brand:#8B1E2B;
  --mint:#7A8A6B; --mint-tx:#566447; --mint-soft:#E6EAE0;
  --sun:#B8944A; --sun-tx:#7A6024; --sun-soft:#F0E9D9;
  --red:#A04A3C; --red-tx:#8A3B2F; --red-soft:#F1E2DD;
  --sky:#6F8899; --sky-tx:#4F6878; --sky-soft:#E4E9EC;
  --lilac:#857D92; --lilac-tx:#645D72; --lilac-soft:#EAE7ED;
  --peach:#B78A68; --leaf:#899775; --teal:#6E8F86;
  --tape-1:#D9CDB9; --tape-2:#CDD3C2; --tape-3:#C9D2D8; --tape-4:#E2D8BC; --tape-5:#D6D1DC; --tape-6:#C9D5CF; --tape-ink:#2F2E2C;
  --shadow:none;
  --scrim:rgba(30,28,25,.35);
  --nav-h:64px;
  --f-display:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-num:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans TC",sans-serif;
  --f-read:"Noto Serif TC","PMingLiU",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1A18; --card:#232220; --card-2:#2A2926; --line:#383632;
    --ink:#E8E5DF; --sub:#A9A49B; --faint:#77736B;
    --accent:#E3DFD8; --accent-tx:#E3DFD8; --accent-soft:#33312D; --on:#1B1A18; --brand:#D98A86;
    --mint:#98A888; --mint-tx:#AEBC9F; --mint-soft:#283024;
    --sun:#D0B06A; --sun-tx:#DCC184; --sun-soft:#35301F;
    --red:#D58A7B; --red-tx:#E3A193; --red-soft:#3A2622;
    --sky:#93AABA; --sky-tx:#AABFCC; --sky-soft:#232C32;
    --lilac:#A9A1B6; --lilac-tx:#BDB6C8; --lilac-soft:#2C2932;
    --peach:#CDA283; --leaf:#A3B08F; --teal:#8DAEA5;
    --tape-1:#8F8473; --tape-2:#7F8774; --tape-3:#7B868D; --tape-4:#988C6C; --tape-5:#87828E; --tape-6:#7B8A83; --tape-ink:#1B1A18;
    --shadow:none;
    --scrim:rgba(8,7,6,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1A18; --card:#232220; --card-2:#2A2926; --line:#383632;
    --ink:#E8E5DF; --sub:#A9A49B; --faint:#77736B;
    --accent:#E3DFD8; --accent-tx:#E3DFD8; --accent-soft:#33312D; --on:#1B1A18; --brand:#D98A86;
    --mint:#98A888; --mint-tx:#AEBC9F; --mint-soft:#283024;
    --sun:#D0B06A; --sun-tx:#DCC184; --sun-soft:#35301F;
    --red:#D58A7B; --red-tx:#E3A193; --red-soft:#3A2622;
    --sky:#93AABA; --sky-tx:#AABFCC; --sky-soft:#232C32;
    --lilac:#A9A1B6; --lilac-tx:#BDB6C8; --lilac-soft:#2C2932;
    --peach:#CDA283; --leaf:#A3B08F; --teal:#8DAEA5;
    --tape-1:#8F8473; --tape-2:#7F8774; --tape-3:#7B868D; --tape-4:#988C6C; --tape-5:#87828E; --tape-6:#7B8A83; --tape-ink:#1B1A18;
    --shadow:none;
    --scrim:rgba(8,7,6,.55);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background-color:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
}
body.locked{overflow:hidden}
[hidden]{display:none!important}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sky-tx)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--sub)}
.app{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:12px 40px}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mascot{width:48px;height:48px;flex:none}
.eyebrow{font-family:var(--f-num);font-size:10.5px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--brand)}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2;letter-spacing:.14em}
.tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px;box-shadow:var(--shadow)}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:6px;cursor:pointer;font-family:var(--f-display);font-size:14.5px;white-space:nowrap;color:var(--sub);display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .cnt{font-family:var(--f-num);font-size:11.5px;font-weight:600;background:var(--accent);color:var(--on);border-radius:999px;padding:0 6px;line-height:17px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.round{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);padding:0;flex:none}
.round svg{width:20px;height:20px}
.round[aria-current="page"]{border-color:var(--accent);color:var(--accent-tx)}
.round .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-family:var(--f-num);font-weight:600;font-size:11.5px;line-height:16px;text-align:center;border:2px solid var(--bg)}
.scope{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px;box-shadow:var(--shadow)}
.scope button{border:0;background:transparent;border-radius:6px;padding:5px 12px;cursor:pointer;font-family:var(--f-display);color:var(--sub);white-space:nowrap;font-size:13.5px}
.scope button[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.bnav,.fab{display:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 15px;cursor:pointer;font-family:var(--f-display);font-size:14px;line-height:1.25;white-space:nowrap;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--sub)}
.btn svg{width:15px;height:15px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red-tx);border-color:var(--red-soft);background:var(--red-soft)}
.btn.danger.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.ico{width:32px;height:32px;border-radius:50%;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--sub);flex:none;padding:0}
.ico:hover{background:var(--card-2);color:var(--ink)}
.ico svg{width:16px;height:16px}

/* ---------- panels & rows ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;margin:0 0 8px;flex-wrap:wrap}
.panel-h h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.35;letter-spacing:.06em}
.panel-h .n{font-family:var(--f-num);font-size:13px;color:var(--sub)}
.panel-h .act{margin-left:auto}
.panel-h .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--faint));flex:none}
.sub-h{font-family:var(--f-display);font-size:13.5px;color:var(--sub);margin:10px 0 2px;display:flex;align-items:center;gap:6px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.rows > .row:first-child{border-top:0}
.tick{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);background:var(--card);cursor:pointer;display:grid;place-items:center;padding:0;margin-top:0;transition:transform .15s,background .15s,border-color .15s}
.tick svg{width:15px;height:15px;opacity:0;color:var(--on)}
.tick:hover{border-color:var(--mint);transform:scale(1.08)}
.tick.on{background:var(--mint);border-color:var(--mint)}
.tick.on svg{opacity:1;color:var(--on)}
.tick[disabled]{cursor:default;transform:none}
.row-ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.row-ic svg{width:15px;height:15px}
.row-ic.k-cert{background:var(--lilac-soft);color:var(--lilac-tx)}
.row-ic.k-certday{background:var(--sun-soft);color:var(--sun-tx)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row.is-done .row-title{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint);text-decoration-thickness:1px}
.row-meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--sub);margin-top:2px}
.row-meta .m{display:inline-flex;align-items:center;gap:3px;overflow-wrap:anywhere}
.row-meta .m svg{width:12px;height:12px;flex:none;opacity:.8}
.row-meta .sel{user-select:all}
.row-meta a.m{color:var(--sky-tx)}
.row-note{font-size:12.5px;color:var(--sub);margin-top:4px;padding:4px 8px;border-radius:8px;background:var(--card-2);white-space:pre-wrap;overflow-wrap:anywhere}
.row .stamp{width:40px;height:40px;flex:none;margin:-6px 0 -8px}
.pri{display:inline-block;font-size:11px;line-height:16px;padding:0 5px;border:1px solid;border-radius:3px;margin-right:6px;vertical-align:1px;font-weight:500}
.pri.u{color:var(--red-tx);border-color:var(--red)}
.pri.i{color:var(--sun-tx);border-color:var(--sun)}
.rep-ic{display:inline-flex;vertical-align:-2px;margin-left:4px;color:var(--sub)}
.rep-ic svg{width:13px;height:13px}
.scope-p{font-family:var(--f-display);font-size:11px;padding:0 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent-tx)}
.scope-p.s-shinnyo{background:var(--lilac-soft);color:var(--lilac-tx)}
.field input:disabled{opacity:.4}
input.time-in[aria-invalid="true"]{border-color:var(--red)!important;background:var(--red-soft)!important}
.tag{flex:none;font-family:var(--f-display);font-size:11.5px;padding:1px 8px;border-radius:3px;white-space:nowrap;margin-top:2px}
.tag.overdue{background:var(--red-soft);color:var(--red-tx)}
.tag.today{background:var(--accent-soft);color:var(--accent-tx)}
.tag.soon{background:var(--sun-soft);color:var(--sun-tx)}
.tag.later{background:var(--card-2);color:var(--sub)}
.tag.done{background:var(--mint-soft);color:var(--mint-tx)}
.tag.watch{background:var(--sky-soft);color:var(--sky-tx)}
.cat i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.app-tag{display:inline-block;font-family:var(--f-display);font-size:11.5px;line-height:1.5;padding:0 7px;border-radius:4px;margin-right:6px;vertical-align:1px;color:var(--tape-ink);background-color:var(--tape)}
.empty{color:var(--sub);padding:6px 0;font-size:13px}
.empty b{display:block;color:var(--ink);font-weight:500;font-size:14px}
.more{font-size:12px;color:var(--sub);padding:6px 2px 0}
.link-btn{border:0;background:none;color:var(--accent-tx);cursor:pointer;font-family:var(--f-display);padding:0;font-size:13px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--sun);border-radius:8px;padding:8px 14px;margin-bottom:14px}
.banner p{margin:0;flex:1;min-width:200px}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- today ---------- */
.hero{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 18px;align-items:center;padding:16px 18px}
.quote-card{position:relative;margin-top:16px;padding:20px 22px 12px}
.q-head{font-family:var(--f-display);font-weight:500;font-size:12.5px;color:var(--brand);letter-spacing:.14em;text-wrap:balance}
.q-text{margin-top:8px;font-family:var(--f-read);font-weight:500;font-size:16px;line-height:2;letter-spacing:.03em;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.q-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--sub)}
.q-foot .link-btn{display:inline-flex;align-items:center;gap:4px}
.q-foot .link-btn svg{width:14px;height:14px}
.modal.daily{z-index:53;width:min(500px,calc(100vw - 24px));padding:0}
.daily-paper{position:relative;padding:30px 26px 4px}
.daily-paper .q-date{font-family:var(--f-num);font-size:13px;color:var(--sub);margin-bottom:6px}
.daily-paper .q-head{font-size:13px}
.daily-paper .q-text{font-size:17px;margin:12px 0 6px}
.daily-paper .slot-foot{padding:14px 0 18px}
.q-list{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--line)}
.q-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--sub)}
.q-item span{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero > .mascot{width:56px;height:56px}
/* 精簡提醒列：問候語一行小字，不佔版面（使用者要求） */
.hello{font-family:var(--f-display);font-weight:500;font-size:15px;line-height:1.4;color:var(--ink);letter-spacing:.03em}
.today-date{font-family:var(--f-num);color:var(--sub);font-size:12.5px;margin-top:1px}
.summary{margin-top:4px;color:var(--sub);max-width:60ch;font-size:12.5px;line-height:1.5}
.summary b{font-family:var(--f-num);color:var(--ink);font-weight:600;font-size:13px}
.next-ntf{width:250px;max-width:100%;background:var(--card-2);border:0;border-radius:6px;padding:10px 12px}
.nn-h{font-family:var(--f-display);font-weight:500;font-size:12.5px;letter-spacing:.06em;color:var(--sub);margin-bottom:4px}
.nn-list{display:flex;flex-direction:column}
.nn-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}
.nn-list .nn-row:first-child{border-top:0}
.nn-t{color:var(--accent-tx);font-weight:600;white-space:nowrap}
.nn-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.nn-k{font-size:11px;color:var(--sub);white-space:nowrap}
.nn-empty{font-size:12.5px;color:var(--sub);padding:4px 0}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.mini-app{display:flex;flex-direction:column;gap:6px;padding:10px 0;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.mini-app:first-child{border-top:0}
.mini-top{display:flex;align-items:center;gap:8px;min-width:0}
.mini-top .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.mini-top .left{font-family:var(--f-num);font-size:12.5px;color:var(--sub);white-space:nowrap}
.mini-next{font-size:12.5px;color:var(--sub)}
.prog{height:6px;border-radius:4px;background:var(--card-2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;border-radius:4px;background:var(--mint)}

/* ---------- 心情結語 ---------- */
.mood{margin-top:16px}
.mood .panel-h{margin-bottom:4px}
.mood-st{margin-left:auto;font-size:11.5px;color:var(--faint)}
.mood-in{display:block;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:4px 0 6px;font-family:var(--f-read);font-size:16px;line-height:1.8;color:var(--ink);resize:none;outline:0;overflow:hidden}
.mood-in:focus{border-bottom-color:var(--ink)}
.mood-in::placeholder{color:var(--faint);font-family:var(--f-body);font-size:14px}
.mood.sub{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.mood-list{display:flex;flex-direction:column}
.mood-row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.mood-row:first-child{border-top:0}
.mood-row .d{color:var(--sub);font-family:var(--f-num);font-size:12.5px}
.mood-row .t{font-family:var(--f-read);line-height:1.7;overflow-wrap:anywhere}

.ver-foot{text-align:center;margin:22px 0 0;font-family:var(--f-num);font-size:11.5px;letter-spacing:.06em;color:var(--faint)}
.ver-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0!important;font-size:13px;color:var(--sub)}
.ver-line b{font-family:var(--f-num);color:var(--ink);font-weight:600}

/* ---------- agenda ---------- */
.ag-day{margin-bottom:14px}
.ag-head{display:flex;align-items:baseline;gap:8px;padding:0 4px 6px}
.ag-head b{font-family:var(--f-display);font-weight:400;font-size:16px}
.ag-head span{font-size:12.5px;color:var(--sub)}
.ag-day .panel{padding:4px 16px}
.chk-inline{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13.5px}
.chk-inline input{width:17px;height:17px;accent-color:var(--accent)}

/* ---------- calendar ---------- */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .grow{flex:1}
.month-title{font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:.06em;min-width:130px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:22px;height:9px;border-radius:3px;background-color:var(--tape-1)}
.legend svg{width:13px;height:13px}
.cal{--dh:30px;--lh:20px;--ch:58px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--card-2)}
.cal-head div{padding:7px 8px;font-family:var(--f-display);font-size:13px;color:var(--sub)}
.cal-head div.sat,.dnum.sat{color:var(--sky-tx)}
.cal-head div.sun,.dnum.sun{color:var(--red-tx)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.dbg{grid-row:1/-1;border:0;border-left:1px solid var(--line);background:transparent;cursor:pointer;padding:0;min-width:0;border-radius:0}
.dbg.c1{border-left:0}
.dbg:hover{background:var(--card-2)}
.dbg.out{background:var(--card-2)}
.dbg.is-today{background:var(--accent-soft)}
.dbg.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dbg:focus-visible{outline-offset:-3px}
.dnum{grid-row:1;z-index:1;pointer-events:none;padding:5px 8px 0;font-family:var(--f-num);font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:6px;min-width:0}
.dnum.out{color:var(--faint)}
.dnum .tdot{font-family:var(--f-display);font-size:10.5px;font-weight:400;background:var(--brand);color:#fff;border-radius:999px;padding:0 6px;line-height:16px}
.band{z-index:2;margin:2px 0;border:0;padding:0 7px;font-family:var(--f-display);font-size:11.5px;line-height:1;color:var(--tape-ink);background-color:var(--tape);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;cursor:pointer;min-width:0;text-align:left;border-radius:0}
.band.rs{margin-left:5px;border-top-left-radius:8px;border-bottom-left-radius:8px}
.band.re{margin-right:5px;border-top-right-radius:8px;border-bottom-right-radius:8px}
.band span{overflow:hidden;text-overflow:ellipsis}
.band svg{width:12px;height:12px;flex:none}
.band .end{margin-left:auto}
.band.st-paused,.band.st-cancelled{filter:grayscale(1);opacity:.55}
.dchips{display:flex;flex-direction:column;gap:3px;padding:3px 5px 7px;min-width:0;pointer-events:none;z-index:1}
.chip{display:flex;align-items:center;gap:4px;font-size:11.5px;line-height:1.4;padding:1px 6px 1px 5px;border-radius:6px;background:var(--card-2);color:var(--ink);overflow:hidden;white-space:nowrap;min-width:0}
.chip i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip .ic{flex:none;display:grid}
.chip .ic svg{width:11px;height:11px}
.chip .ct{overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip b{font-family:var(--f-num);font-weight:500}
.chip.k-step,.chip.k-certday{background:var(--c);color:var(--tape-ink)}
.chip.k-cert{background:var(--lilac-soft);color:var(--lilac-tx)}
.chip.done{opacity:.5;text-decoration:line-through}
.chip.l-overdue{box-shadow:inset 0 0 0 1.5px var(--red)}
.chip.l-soon,.chip.l-today{box-shadow:inset 0 0 0 1.5px var(--sun)}
.chip.more-chip{background:transparent;color:var(--sub);padding-left:2px}
.chip .pm{color:var(--red-tx);font-weight:700}
.chip .pm.i{color:var(--sun-tx)}
.cal-hint{margin:8px 2px 0;font-size:12px;color:var(--sub)}
/* 月曆當天的快速新增列 */
.qa{display:flex;flex-direction:column;gap:6px;padding:2px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.qa-row{display:flex;gap:8px}
.qa-in{flex:1;min-width:0;background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:16px;outline:0}
.qa-in:focus{border-color:var(--accent)}
.qa-opts{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.qa-sc{border:1px solid var(--line);background:transparent;border-radius:3px;padding:1px 9px;font-size:12.5px;cursor:pointer;color:var(--sub)}
.qa-sc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.qa-more{margin-left:auto;font-size:12.5px}
.qa-prev{font-size:12px;color:var(--sub);line-height:1.5;overflow-wrap:anywhere}
.qa-prev b{color:var(--ink);font-weight:500}
.daypanel .period{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:6px;background:var(--card-2);margin-bottom:6px}
.tape-sw{width:20px;height:10px;border-radius:3px;flex:none;background-color:var(--tape)}

/* ---------- certification ---------- */
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:6px;padding:6px 13px;cursor:pointer;font-family:var(--f-display);color:var(--sub);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .c{font-family:var(--f-num);font-size:12px;margin-left:3px}
.apps-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,500px),1fr));gap:22px 18px;padding-top:8px}
.app-card{position:relative;border-top:3px solid var(--tape)}
.app-head{display:flex;align-items:flex-start;gap:10px}
.app-head .ttl{flex:1;min-width:0}
.app-name{font-family:var(--f-display);font-weight:500;font-size:16.5px;line-height:1.4;overflow-wrap:anywhere}
.app-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.scheme{font-family:var(--f-num);font-size:11.5px;font-weight:500;border:1px solid var(--sub);border-radius:6px;padding:0 6px;line-height:18px}
.app-meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--sub);font-size:12.5px;margin-top:10px}
.app-meta .m{display:inline-flex;align-items:center;gap:4px;overflow-wrap:anywhere}
.app-meta svg{width:13px;height:13px;flex:none}
.tl{margin:18px 0 4px}
.tl-track{position:relative;height:16px;border-radius:8px;background:var(--card-2);border:1px solid var(--line)}
.tl-fill{position:absolute;top:0;bottom:0;left:0;border-radius:8px;background-color:var(--tape)}
.tl-dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2.5px solid var(--card);background:var(--faint);z-index:1}
.tl-dot.done{background:var(--mint)}
.tl-dot.overdue{background:var(--red)}
.tl-dot.soon,.tl-dot.today{background:var(--sun)}
.tl-now{position:absolute;top:-7px;bottom:-7px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px;z-index:2}
.tl-now::after{content:"今天";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-size:10.5px;color:var(--ink);white-space:nowrap}
.tl-labels{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
.tl-labels b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.app-prog{display:flex;align-items:center;gap:10px;margin:12px 0 2px;font-size:13px}
.app-prog .prog{flex:1}
.app-prog b{font-family:var(--f-num);font-weight:600}
.stickers{display:flex;gap:2px;flex-wrap:wrap}
.stickers .stamp{width:26px;height:26px}
.stickers .pend{width:26px;height:26px;display:grid;place-items:center}
.stickers .pend i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--faint)}
.app-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.app-note{font-size:12.5px;color:var(--sub);margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);min-width:0}
.tile .v{font-family:var(--f-num);font-size:26px;font-weight:400;line-height:1.05}
.tile .l{font-size:12.5px;color:var(--sub)}
.tile.t-red .v{color:var(--red-tx)}
.tile.t-sun .v{color:var(--sun-tx)}
.tile.t-sky .v{color:var(--sky-tx)}
.tile.t-mint .v{color:var(--mint-tx)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 14px;min-width:0;flex:1;max-width:380px;box-shadow:var(--shadow)}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.search svg{width:16px;height:16px;color:var(--sub);flex:none}
.cert-group{margin-bottom:16px;padding:0;overflow:hidden}
.cert-group .panel-h{padding:12px 18px 10px;margin:0;border-bottom:1px solid var(--line)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;color:var(--sub);font-weight:500;padding:8px 14px;background:var(--card-2);white-space:nowrap}
td{padding:8px 14px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
td.wrap{white-space:normal;min-width:140px;color:var(--sub);font-size:12.5px}
tbody tr:hover td{background:var(--card-2)}
td.proj{font-weight:700}

/* ---------- report ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12.5px;color:var(--sub)}
.kpi .v{font-family:var(--f-num);font-size:26px;font-weight:400;line-height:1.15}
.kpi .v small{font-size:14px;color:var(--sub);font-weight:500;margin-left:3px}
.kpi .s{font-size:12px;color:var(--sub)}
.chart-box{overflow-x:auto}
.chart-svg{width:100%;height:auto;display:block}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--sub);font-family:var(--f-num);font-size:11px}
.ax.sm{font-size:10px}
.ax.now{fill:var(--accent-tx);font-weight:600}
.b-done{fill:var(--mint)}
.b-open{fill:var(--sun)}
.b-open.late{fill:var(--red)}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.catbars{display:flex;flex-direction:column;gap:8px}
.catbar{display:grid;grid-template-columns:84px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.catbar .trk{height:12px;border-radius:6px;background:var(--card-2);overflow:hidden;display:flex;border:1px solid var(--line)}
.catbar .trk i{display:block;height:100%}
.catbar .c{font-family:var(--f-num);color:var(--sub);text-align:right}
.rep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}

/* ---------- settings ---------- */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.set-grid .panel p{margin:0 0 10px;color:var(--sub)}
.set-acts{display:flex;flex-wrap:wrap;gap:8px}
.set-list{margin:0;padding-left:20px;color:var(--sub)}
.set-list li{margin-bottom:4px}
.stat-line{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--sub);margin-bottom:10px}
.stat-line b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.excel-note{display:flex;align-items:center;gap:6px;margin:-4px 0 14px;font-size:12.5px;color:var(--sub)}
.excel-note b{color:var(--ink);font-weight:500}
.diff-list{list-style:none;margin:0 0 6px;padding:0;border-top:1px solid var(--line)}
.diff-list li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:6px 2px;border-bottom:1px solid var(--line);font-size:13px}
.diff-list li .num{margin-left:auto;color:var(--accent-tx);white-space:nowrap}
.file-btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.set-grid .span2{grid-column:1/-1}
.sync-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sync-row input{flex:1;min-width:220px;background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:8px 14px;outline:0;font-size:16px}
.sync-row input:focus{border-color:var(--accent)}
.field textarea.gcode{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre;overflow:auto;min-height:120px}
.g-steps li{margin-bottom:6px}
.set-list code{font-size:12px;background:var(--card-2);padding:0 4px;border-radius:4px}
.round .sdot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--mint);border:2px solid var(--bg)}
.round .sdot.busy{background:var(--sun)}
.round .sdot.err{background:var(--red)}
.pair-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-bottom:10px}
.qr-box{width:200px;min-height:200px;display:grid;place-items:center;background:#fff;border-radius:8px;padding:8px;color:#5F6782;font-size:12.5px;text-align:center}
.qr-box img{width:184px;height:184px;image-rendering:pixelated}
@media (max-width:560px){.pair-grid{grid-template-columns:minmax(0,1fr)}.qr-box{margin:0 auto}}

/* ---------- layers ---------- */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:45;backdrop-filter:blur(2px)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,calc(100vw - 24px));max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);border-radius:10px;box-shadow:0 30px 80px -24px rgba(0,0,0,.5);z-index:55;padding:20px 22px;animation:rise .22s ease-out;overscroll-behavior:contain}
@keyframes rise{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
.sheet-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em}
.sheet-h p{margin:2px 0 0;color:var(--sub);font-size:13px}
.sheet-h .x{margin-left:auto;align-self:flex-start}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.fsec{grid-column:1/-1;font-family:var(--f-display);font-size:14px;color:var(--accent-tx);margin-top:6px;display:flex;align-items:center;gap:8px}
.fsec::after{content:"";flex:1;height:1px;background:var(--line)}
.field{min-width:0}
.field > label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea{width:100%;background:var(--card-2);border:1.5px solid var(--line);border-radius:6px;padding:8px 11px;outline:0;min-width:0;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:12px;color:var(--faint);margin-top:3px}
.wd-hint{font-family:var(--f-display);font-size:13.5px;color:var(--accent-tx);margin-top:4px;padding-left:4px}
.wd-hint:empty{display:none}
.se-dwrap{display:flex;flex-direction:column;gap:1px;min-width:0}
.se-dwrap .wd-hint{font-size:11.5px;margin-top:0}
.req{color:var(--accent-tx)}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-top:22px}
.checks label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin:0;color:var(--ink);font-size:14px}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.radio-seg{display:flex;gap:6px}
.radio-seg label{flex:1;cursor:pointer;margin:0}
.radio-seg input{position:absolute;opacity:0;pointer-events:none}
.radio-seg span{display:block;text-align:center;padding:8px 10px;border-radius:6px;border:1.5px solid var(--line);background:var(--card-2);font-family:var(--f-display)}
.radio-seg input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-tx)}
.radio-seg input:focus-visible + span{outline:2.5px solid var(--accent);outline-offset:2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer;margin:0}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches span{display:block;width:40px;height:24px;border-radius:5px;border:2px solid transparent;background-color:var(--tape)}
.swatches input:checked + span{border-color:var(--ink)}
.swatches input:focus-visible + span{outline:2.5px solid var(--accent);outline-offset:2px}
.steps-ed{display:flex;flex-direction:column;gap:8px}
.step-ed{display:grid;grid-template-columns:150px 110px minmax(0,1fr) auto auto;gap:6px;align-items:center;background:var(--card-2);border-radius:6px;padding:6px}
.step-ed input:not([type=checkbox]){background:var(--card)!important;width:100%;border:1.5px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;font-size:15px}
.step-ed .dn{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--sub);white-space:nowrap}
.step-ed .dn input{width:17px;height:17px;accent-color:var(--mint)}
.steps-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* 新增／編輯事項：參考 iPhone 行事曆的分組欄位 */
.sheet-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:-4px 0 14px}
.sheet-bar h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:16.5px;letter-spacing:.06em;text-align:center}
.sheet-bar .link-btn{justify-self:start;font-size:15px;color:var(--sub)}
.sheet-bar .btn{justify-self:end}
.form-note{margin:-6px 0 12px;font-size:12.5px;color:var(--sub);text-align:center}
.type-seg{display:flex;width:100%;margin-bottom:14px}
.type-seg button{flex:1}
.ios .fg{background:var(--card-2);border-radius:8px;margin-bottom:12px;overflow:hidden}
.ios .fg > * + *{border-top:1px solid var(--line)}
.ios .fi-in{display:block;width:100%;border:0;background:transparent;padding:11px 14px;font-size:16px;outline:0;color:var(--ink)}
.ios textarea.fi-in{min-height:84px;resize:vertical}
.ios .qf .qa-prev{padding:0 14px 10px;border:0}
.ios .fr{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:10px;padding:6px 14px;min-height:44px}
.ios .fr.off{display:none}
.ios .fl{font-size:14px;color:var(--ink)}
.ios .fv{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0;flex-wrap:wrap}
.ios .fv input:not([type=checkbox]):not([type=radio]),.ios .fv select{border:0;background:transparent;text-align:right;text-align-last:right;font-size:16px;padding:4px 0;outline:0;min-width:0;max-width:100%;color:var(--ink)}
.ios .fv input:not([type=checkbox]):not([type=radio]){flex:1}
.ios .fv input.time-in{flex:0 1 120px}
.ios .fv input[type=date]{flex:0 1 auto}
.ios .fv .wd-hint{order:-1;margin:0;padding:0;font-size:12.5px;color:var(--sub)}
.ios .fv input:focus,.ios .fv select:focus{color:var(--accent-tx)}
.time-in[data-keytime]{cursor:text}
.ios .fv input.time-in[data-keytime]:focus{box-shadow:inset 0 -1.5px 0 var(--accent)}
.ios .fr-chips{display:block;padding:4px 14px 10px;min-height:0}
.ios .fr-del{display:block;width:100%;border:0;background:transparent;color:var(--red-tx);padding:12px 14px;font-size:15px;cursor:pointer;text-align:center}
.ios .fr-del.armed{background:var(--red);color:#fff}
.radio-seg.sm{width:100%;gap:4px}
.radio-seg.sm span{padding:5px 6px;font-size:13px;border-width:1px;background:var(--card)}
.switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--mint)}
.switch:checked::after{transform:translateX(18px)}
.d-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.d-chip{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:2px 10px;font-size:12.5px;cursor:pointer;color:var(--sub)}
.d-chip:hover{border-color:var(--sub);color:var(--ink)}
.form-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.form-foot .left{margin-right:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);background:var(--bg);z-index:50;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:-24px 0 60px -30px rgba(0,0,0,.55);animation:slide .25s ease-out;overscroll-behavior:contain}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drawer .panel{margin-bottom:14px}

const mascot = (mood = 'calm', cls = '') => `<span class="mascot mphoto ${cls}" aria-hidden="true"><img src="mascot/${PHOTO[mood] || 'happy'}.jpg" alt="" decoding="async"></span>`;

const QUOTE_HEAD = '與真如繼主同在，這時候，深呼吸';
function seededShuffle(arr, seed) {
  const a = arr.slice(); let x = (seed * 9301 + 49297) % 233280;
  const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function quoteOf(date) {
  const qs = S.quotes.filter(q => q.text && q.text.trim()).slice().sort((a, b) => a.id < b.id ? -1 : 1);
  if (!qs.length) return null;
  const n = qs.length, d = diff('2024-01-01', date), c = Math.floor(d / n);
  if (n === 2) return qs[((d % 2) + 2) % 2];
  const order = seededShuffle(qs, c + 7);

  if (n > 1 && order[0] === seededShuffle(qs, c + 6)[n - 1]) [order[0], order[1]] = [order[1], order[0]];

const MOOD_MAX = 100;

  return inPanel ? `<div class="mood sub">${head}${box}</div>` : `<section class="panel mood">${head}${box}</section>`;

function saveMood(d, raw) {

}

function vCalendar() {

/* ================= 推播提醒：只在前一天提醒一次（使用者要求） =================
   有時間的事：前一天同一時間；整日／沒填時間：前一天 09:00。重複事項每次各提醒一次。
   App 開著或在背景時由 App 發通知；App 關著時靠 iPhone 行事曆（訂閱或匯出的 .ics，見 alarmsFor）。 */
const NTF_KEY = 'msec.ntf.v1';
function noticeTimes(e) {
  if (!['item', 'step', 'certday'].includes(e.k) || e.done || !e.live) return [];
  const [y, m, d] = e.date.split('-').map(Number);
  if (e.time && !e.allDay) {
    const [h, mi] = e.time.split(':').map(Number);
    return [{ at: new Date(new Date(y, m - 1, d, h, mi).getTime() - 864e5), kind: 'day' }];
  }
  return [{ at: new Date(y, m - 1, d - 1, 9, 0), kind: 'day' }];
}
const noticeName = e => e.k === 'certday' ? `預計取證：${appName(e.app)}` : e.k === 'step' ? `${appName(e.app)}｜${e.title}` : priWord(priOf(e.ref)) + e.title;
function noticeText(e, n) {
  const when = '明天';
  const t = timeLabel(e);
  return `${when}${t ? ' ' + t : ''}｜${noticeName(e)}`;
}
function upcomingNotices(limit) {
  const now = Date.now(), hi = addDays(TODAY, 3), list = [];
  EV.filter(e => e.date >= TODAY && e.date <= hi).forEach(e => noticeTimes(e).forEach(n => { if (n.at.getTime() > now) list.push({ e, n }); }));
  return list.sort((a, b) => a.n.at - b.n.at).slice(0, limit);
}
const fmtAt = d => { const s = ymd(d); return `${s === TODAY ? '今天' : s === addDays(TODAY, 1) ? '明天' : `${md(s)}（${wd(s)}）`} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function nextNoticesHtml(limit) {
  const ups = upcomingNotices(limit);
  if (!ups.length) return '<div class="nn-empty">三天內沒有需要推播的事</div>';
  return `<div class="nn-list">${ups.map(x => `<div class="nn-row"><span class="nn-t num">${fmtAt(x.n.at)}</span><span class="nn-n">${esc(noticeName(x.e))}</span><span class="nn-k">${md(x.e.date)}（${wd(x.e.date)}）的事</span></div>`).join('')}</div>`;
}
function checkNotices() {
  let sent = {}; try { sent = JSON.parse(ls.get(NTF_KEY)) || {}; } catch (e) { sent = {}; }
  const now = Date.now(), lo = addDays(TODAY, -1), hi = addDays(TODAY, 2), due = [];
  EV.filter(e => e.date >= lo && e.date <= hi).forEach(e => noticeTimes(e).forEach(n => {
    const key = `${e.key}|${e.date}|${n.kind}`, t = n.at.getTime();
    // 過了提醒時間 6 小時內才補發，太舊的就不發了
    if (t <= now && now - t < 6 * 36e5 && !sent[key]) { due.push({ e, n }); sent[key] = e.date; }
  }));
  const cutoff = addDays(TODAY, -3);
  Object.keys(sent).forEach(k => { if (sent[k] < cutoff) delete sent[k]; });
  ls.set(NTF_KEY, JSON.stringify(sent));
  if (!due.length) return;
  const lines = due.map(x => noticeText(x.e, x.n));
  if (due.length === 1) { sysNotify('行動祕書提醒', lines[0]); toast(lines[0], 'calm'); }
  else { sysNotify(`行動祕書：${due.length} 則提醒`, lines.slice(0, 4).join('\n')); toast(`${due.length} 則提醒：${lines[0]}…`, 'calm'); }
  chime();
}

let audioCtx = null;
function chime() {

  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    audioCtx = audioCtx || new A();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    [[784, 0], [1046.5, .14], [1318.5, .28]].forEach(([f, dt]) => {

}

/* 時間欄：電腦（以滑鼠為主的裝置）上設成唯讀、由 App 自己接數字鍵。唯讀欄位不會啟動注音輸入法，

// 剛進入欄位時打第一個數字會取代原本的時間；Backspace 刪一個字、Delete 清空
function keyTime(ev) {
  const el = ev.target;
  if (!el.dataset || el.dataset.keytime !== '1' || el.disabled || ev.ctrlKey || ev.metaKey || ev.altKey) return false;

async function readReviewWorkbook(file) {

  if (hi < 0) throw new Error('noheader');

    const k = certKey(r.project, r.cert);

  skipped.forEach(r => seen.add(certKey(r.project, r.cert)));
  const missing = S.certs.filter(c => !c.sample && (c.state || 'normal') !== 'retired' && !seen.has(certKey(c.project, c.cert)));
  return { added, changed, same, skipped, missing };
}

        f: { title: `${st.done ? '✓ ' : ''}【認證】${appName(a)}｜${st.title}`, date: st.date, time: st.time || '', allDay: !st.time } });

      f: { title: `${a.status === 'obtained' ? '【取證】' : '【預計取證】'}${appName(a)}`, date: cd, allDay: true } });

    out.set(gEv.cert(c.id), { kind: 'cert', upd: c.updatedAt || '', fresh: c.due >= lo, color: G_COLOR.cert, rem: [39780, 900], desc: '證書到期（由行動祕書同步，請在 App 修改）',

/* ---- 同步計畫：先讀兩邊，算出要對 Google 做的動作（ops）與要改 App 的地方 ---- */
const gNewPlan = () => ({ ops: [], errs: [], set: new Map(), add: new Map(), del: new Map(), ro: 0 });
const gSet = (P, it, f) => { const x = P.set.get(it.id); P.set.set(it.id, { f: Object.assign(x ? x.f : {}, f), upd: it.updatedAt }); };
const gDel = (P, it) => P.del.set(it.id, it.updatedAt);
function gPlanApp(evs, P) {
  const want = gAppObjects();
  const byId = new Map(evs.map(e => [e.id, e]));
  for (const [id, o] of want) {
    const e = byId.get(id);
    if (!e) { if (o.fresh) P.ops.push({ op: 'upsert', cal: '@app', id, body: gFullBody(o, null) }); continue; }
    if (e.status === 'cancelled') {
      // 在 Google 刪掉了：App 之後又改過就放回去；否則事項跟著刪（節點、證書不刪 App 資料，也不再放回）
      if (gT(o.upd) > gT(e.updated)) { if (o.fresh) P.ops.push({ op: 'upsert', cal: '@app', id, body: gFullBody(o, e) }); }
      else if (o.kind === 'item') gDel(P, o.ref);
      continue;
    }
    if (!e.start) continue;
    const g = evF(e), two = o.kind === 'item', withRep = two && g.repeat !== 'custom';
    const groups = gDiff(o.f, g, withRep);
    if (groups.length && two && gT(e.updated) > gT(o.upd)) { gSet(P, o.ref, gFields(g, groups)); continue; }
    const body = groups.length ? gPatchBody(o.f, e, groups, withRep, gRem(o)) : {};
    if (e.colorId !== o.color) body.colorId = o.color;
    if (Object.keys(body).length) P.ops.push({ op: 'patch', cal: '@app', id, body });
  }
  for (const e of evs) {
    if (want.has(e.id) || e.status === 'cancelled' || e.recurringEventId) continue;
    const d = gDecode(e.id);
    if (d) { if (gGone(d, e)) P.ops.push({ op: 'remove', cal: '@app', id: e.id }); }
    else gAdopt(e, P);
  }
}
// App 這邊確定刪掉／取消／不續證了才從 Google 移除；只是這台還沒有的資料（可能別台較新）就不動
function gGone(d, e) {
  const T = gT(e.updated);
  if (d.kind === 'item') return !!S.deleted['items:' + d.id];
  if (d.kind === 'cert') { if (S.deleted['certs:' + d.id]) return true; const c = S.certs.find(x => x.id === d.id); return !!c && gT(c.updatedAt) > T; }
  if (S.deleted['apps:' + d.id]) return true;
  const a = S.apps.find(x => x.id === d.id);
  return !!a && gT(a.updatedAt) > T;
}
// 使用者直接在 Google 的「行動祕書」日曆新增的行程：收編成一般事項（有邀請對象或複雜重複規則的不動）
function gAdopt(e, P) {
  if (e.guests || !e.start) return;
  const g = evF(e);
  if (g.repeat === 'custom' || !isDate(g.date)) return;
  const id = 'ga' + gHash(e.id);
  if (S.items.some(x => x.id === id) || S.deleted['items:' + id]) { P.ops.push({ op: 'remove', cal: '@app', id: e.id }); return; }
  const it = { id, scope: gcal.scope || 'personal', cat: '其他', title: g.title, date: g.date, allDay: g.allDay, time: g.time, endTime: g.endTime, location: g.location,
    repeat: g.repeat, until: g.until, note: gDesc(e.description), link: safeUrl(e.link), done: false, createdAt: iso(), updatedAt: iso() };
  P.add.set(id, it);
  P.ops.push({ op: 'upsert', cal: '@app', id: gEv.item(id), body: gFullBody(gObjItem(it), e),
    then: r => { if (r.ok) P.ops.push({ op: 'remove', cal: '@app', id: e.id }); else P.errs.push(r.error); } });
}
function gPlanPrimary(evs, P, lo, hi) {
  const items = new Map(S.items.map(x => [x.id, x]));
  const seen = new Set();
  for (const e of evs) {
    if (e.eventType === 'workingLocation') continue;
    const iid = gItemId(e.id), it = items.get(iid);
    seen.add(iid);
    if (e.status === 'cancelled' || e.declined) { if (it && it.gsrc) gDel(P, it); continue; }
    if (!e.start) continue;
    if (!it) {
      const tb = S.deleted['items:' + iid];
      if (tb && gT(tb) >= gT(e.updated)) P.ops.push({ op: 'remove', cal: 'primary', id: e.id }); // 在 App 刪掉了
      else gImport(e, P);
      continue;
    }
    if (it.gsrc) gCompareImported(it, e, P);
  }
  // 原本在範圍內、這次卻沒出現：可能被刪了或改到很遠的日期，個別查一次
  for (const it of S.items) {
    if (!it.gsrc || !it.gev || seen.has(it.id) || !isDate(it.date) || it.date < lo || it.date > hi) continue;
    P.ops.push({ op: 'get', cal: 'primary', id: it.gev, then: r => {
      if (r.ok && r.data && r.data.status !== 'cancelled' && !r.data.declined && r.data.start) gCompareImported(it, r.data, P);
      else if (r.ok || /not ?found|deleted|\b40[14]\b|\b410\b/i.test(r.error || '')) gDel(P, it);
      else P.errs.push(r.error);
    } });

}
function gImport(e, P) {
  const g = evF(e), id = gItemId(e.id);
  if (!isDate(g.date)) return;
  P.add.set(id, { id, gsrc: 'primary', gev: e.id, scope: gcal.scope || 'personal', cat: '其他', title: g.title, date: g.date, allDay: g.allDay, time: g.time, endTime: g.endTime,
    location: g.location, note: gDesc(e.description), link: safeUrl(e.link), repeat: 'none', until: '', done: false, createdAt: iso(),
    updatedAt: e.updated || iso() }); // 用 Google 的修改時間：別台裝置若已補過屬性、備註，合併時以那邊為準
}
function gCompareImported(it, e, P) {
  const g = evF(e), groups = gDiff(gItemF(it), g, false);
  if (!groups.length) return;
  if (gT(e.updated) > gT(it.updatedAt)) { gSet(P, it, gFields(g, groups)); return; }
  P.ops.push({ op: 'patch', cal: 'primary', id: e.id, body: gPatchBody(gItemF(it), e, groups, false, null), then: r => {
    if (r.ok) return;
    // 別人邀請的會議只有主辦人能改：還原成 Google 上的樣子
    if (/forbidden|403|writer access|organizer|cannot be (changed|modified)/i.test(r.error || '')) { gSet(P, it, gFields(g, groups)); P.ro++; }
    else P.errs.push(r.error);
  } });
}

/* ---- 傳送 ---- */
async function gPost(url, key, ops) {
  let res;
  try { res = await fetch(url, { method: 'POST', body: JSON.stringify({ key, tz: gTZ(), ops }), cache: 'no-store', redirect: 'follow' }); }
  catch (e) { const er = new Error('fetch'); er.code = navigator.onLine ? 'reach' : 'net'; throw er; }
  const txt = await res.text();
  let j; try { j = JSON.parse(txt); } catch (e) { const er = new Error('not json'); er.code = 'reach'; throw er; }
  if (!j.ok) { const er = new Error(j.error || 'error'); er.code = j.error === 'KEY' ? 'key' : gErrCode(j.error); throw er; }
  return j;
}
function gErrCode(msg) {
  msg = String(msg || '');
  if (/Calendar is not defined|has not been used|is disabled|accessNotConfigured/i.test(msg)) return 'svc';
  if (/insufficient|authoriz|permission|scope/i.test(msg)) return 'auth';
  return 'gas';
}
const gFail = msg => { const er = new Error(msg); er.code = gErrCode(msg); return er; };
async function gRun(P) {
  for (let round = 0; round < 4 && P.ops.length; round++) {
    const ops = P.ops; P.ops = [];
    for (let i = 0; i < ops.length; i += 25) {
      const chunk = ops.slice(i, i + 25);
      const r = await gPost(gcal.url, gcal.key, chunk.map(({ then, ...o }) => o));
      chunk.forEach((o, j) => {
        const x = (r.res || [])[j] || { ok: false, error: 'no result' };
        if (o.then) o.then(x);
        else if (!x.ok && !(o.op === 'remove' && /not ?found|deleted|\b404\b|\b410\b/i.test(x.error || ''))) P.errs.push(x.error);
      });
    }
  }
}
// 套用到 App：同步途中使用者又改過的那筆先跳過，下次再對；一次大量刪除先暫停，請使用者確認
function gApply(P) {
  const now = iso(); let n = 0;
  const stillSame = (id, upd) => { const it = S.items.find(x => x.id === id); return it && it.updatedAt === upd ? it : null; };
  P.set.forEach((x, id) => { if (P.del.has(id)) return; const it = stillSame(id, x.upd); if (it) { Object.assign(it, x.f, { updatedAt: now }); n++; } });
  P.add.forEach(it => { if (!S.items.some(x => x.id === it.id)) { S.items.push(it); n++; } });
  const dels = Array.from(P.del).filter(([id, upd]) => stillSame(id, upd)).map(([id]) => id);
  const linked = S.items.filter(x => !x.sample).length;
  if (dels.length > 15 && dels.length > linked * 0.3) gs.pendingDel = dels;
  else {
    if (dels.length) { const set = new Set(dels); S.items = S.items.filter(x => !set.has(x.id)); dels.forEach(id => tomb('items', id)); n += dels.length; }
    gs.pendingDel = null;
  }
  if (n) { saveData(); render(); scheduleSync(); }
  return n;
}
function gResolvePending(keep) {
  const ids = new Set(gs.pendingDel || []); gs.pendingDel = null;
  if (!ids.size) return;
  if (keep) {
    // 保留在 App：時間更新為現在，之後會重新寫回 Google（從主日曆帶來的改成一般事項）
    S.items.forEach(it => { if (ids.has(it.id)) { delete it.gsrc; delete it.gev; it.updatedAt = iso(); } });
  } else {
    S.items = S.items.filter(x => !ids.has(x.id)); ids.forEach(id => tomb('items', id));
  }
  commit();
  toast(keep ? `已保留 ${ids.size} 筆，會重新寫回 Google 日曆` : `已刪除 ${ids.size} 筆`, 'calm');
}

/* ---- 同步主流程 ---- */
function scheduleGsync(delay = 3000) {
  if (!gReady()) return;
  clearTimeout(gs.timer); gs.timer = setTimeout(() => gsyncNow(false), delay);
}
async function gsyncNow(manual) {
  if (!gReady()) return;
  if (!navigator.onLine) { gs.err = 'net'; paintG(); return; }
  // 有開 GitHub 同步時，先和其他裝置同步過一次再寫 Google，避免用這台的舊資料去改 Google
  if (syncCfg && !sync.okOnce && !['auth', 'missing'].includes(sync.err)) {
    if (manual) toast('先和其他裝置同步資料，完成後會接著同步 Google 日曆', 'calm');
    gs.waiting = true; gs.last = Date.now(); scheduleSync(100); return;
  }
  if (gs.busy) { gs.again = true; return; }
  gs.busy = true; gs.waiting = false; gs.last = Date.now(); paintG();
  try {
    const lo = addDays(TODAY, -G_PAST), hi = addDays(TODAY, G_FUTURE);
    const head = gcal.me ? [] : [{ op: 'hello' }];
    const r = await gPost(gcal.url, gcal.key, head.concat([
      { op: 'list', cal: '@app', args: { showDeleted: true } },
      { op: 'list', cal: 'primary', args: { singleEvents: true, showDeleted: true, timeMin: parse(lo).toISOString(), timeMax: parse(addDays(hi, 1)).toISOString() } }
    ]));
    const res = r.res || [];
    if (head.length && res[0] && res[0].ok) { gcal.me = res[0].data.me; saveGcal(); }
    const [ra, rp] = res.slice(head.length);
    if (!ra || !ra.ok) throw gFail(ra ? ra.error : 'no result');
    if (!rp || !rp.ok) throw gFail(rp ? rp.error : 'no result');
    const P = gNewPlan();
    gPlanApp(ra.data || [], P);
    gPlanPrimary(rp.data || [], P, lo, hi);
    const pushed = P.ops.filter(o => o.op !== 'get').length;
    const hadPending = !!gs.pendingDel;
    await gRun(P);
    const n = gApply(P);
    gcal.lastSync = iso(); saveGcal();
    gs.err = P.errs.length ? 'part' : null; gs.errMsg = P.errs[0] || ''; gs.errToast = null;
    if (P.ro) toast(`有 ${P.ro} 筆是別人邀請的會議，只有主辦人能改時間或標題，已還原成 Google 上的內容`, 'worried');
    if (gs.pendingDel && !hadPending) toast(`Google 日曆一次刪除了 ${gs.pendingDel.length} 筆行程，請到「設定 → Google 日曆連動」確認要不要也從行動祕書刪除`, 'worried');
    if (gs.pendingDel && (manual || UI.view === 'settings') && !layers.length) render();
    if (manual && !gs.pendingDel) toast(P.errs.length ? `Google 日曆同步完成，但有 ${P.errs.length} 筆沒成功，稍後會再試` : `Google 日曆同步完成${pushed || n ? `（寫入 ${pushed} 筆、帶回 ${n} 筆變更）` : '，兩邊都是最新的'}`, P.errs.length ? 'worried' : 'happy');
  } catch (e) {
    gs.err = e.code || 'net'; gs.errMsg = e.message || '';
    const msg = {
      key: 'Google 日曆連動密碼不符：請到「設定 → Google 日曆連動 → 重新設定」把程式碼再貼一次並重新部署',
      reach: '連不到你的 Google 連動程式：請確認貼的是「網頁應用程式」網址（…/exec），而且「誰可以存取」選「所有人」',
      svc: 'Apps Script 還沒加入 Google Calendar API：請在 Apps Script 左側「服務」按 ＋ 加入，再重新部署',
      auth: 'Google 日曆授權失效：請到 Apps Script 按「部署 → 管理部署作業」重新部署並授權',
      gas: 'Google 日曆同步發生錯誤，稍後會自動再試',
      net: '暫時連不上 Google，稍後會自動再同步'
    }[gs.err] || '暫時連不上 Google，稍後會自動再同步';
    if (manual || gs.errToast !== gs.err) { toast(msg, 'worried'); gs.errToast = gs.err; }

}

async function gConnect(raw, btn) {

function todayPendingCount() { return EV.filter(e => e.date === TODAY && e.k !== 'cert' && e.live && !e.done).length; }
function toggle(btn) {
  const f = findByKey(btn.dataset.key);
  if (f.k === 'item' && f.it) {
    const it = f.it;
    if (isRep(it)) {
      const d = f.date; const dd = Object.assign({}, it.doneDates || {}); const done = !dd[d];
      const lastToday = done && d === TODAY && todayPendingCount() === 1;
      if (done) { dd[d] = iso(); celebrate(btn, it.title); } else delete dd[d];
      Store.patch('items', it.id, { doneDates: dd });

    }

    Store.patch('items', it.id, { done, doneAt: done ? iso() : null });
    if (lastToday) setTimeout(() => toast('今日待辦全部完成', 'happy'), 900);
  } else if (f.k === 'step' && f.app) {
    const a = f.app; const st = (a.steps || []).find(s => s.id === f.stepId); if (!st) return;
    const done = !st.done;
    const lastToday = done && st.date === TODAY && todayPendingCount() === 1;
    const steps = (a.steps || []).map(s => s.id === f.stepId ? Object.assign({}, s, { done, doneAt: done ? iso() : null }) : Object.assign({}, s));
    if (done) celebrate(btn, `${appName(a)}｜${st.title}`);

// 文字拆成段落：每段以「-」開頭（使用者 Word 檔的格式），或段落之間空一行
function splitPassages(raw) {
  const clean = String(raw || '').replace(/\r/g, '');
  const dashed = (clean.match(/^[ \t　]*-/gm) || []).length >= 2;
  return (dashed ? clean.split(/^[ \t　]*-+[ \t　]*/m) : clean.split(/\n[ \t　]*\n+/))
    .map(s => s.replace(/\n{3,}/g, '\n\n').trim().replace(/\{/g, '「').replace(/\}/g, '」')).filter(Boolean);
}

function addQuoteTexts(parts, showToday) {

}

/* 直接讀使用者的 Word 檔（.docx）或段落檔（.json）。docx 是 zip，取 word/document.xml 的段落文字 */
const JSZIP_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
async function docxText(file) {
  if (!window.JSZip) await loadScript(JSZIP_LIB);
  const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
  const doc = zip.file('word/document.xml');
  if (!doc) throw new Error('notdocx');
  const xml = await doc.async('string');
  const unesc = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
  return Array.from(xml.matchAll(/<w:p[ >][\s\S]*?<\/w:p>/g)).map(m => {
    let t = '';
    for (const r of m[0].matchAll(/<w:t(?: [^>]*)?>([\s\S]*?)<\/w:t>|<w:tab\/>|<w:br\/>/g)) t += r[1] !== undefined ? unesc(r[1]) : (r[0] === '<w:tab/>' ? ' ' : '\n');
    return t.replace(/ /g, ' ').trim();
  }).join('\n');
}
async function handleQuoteFile(file) {
  if (!file) return;
  let parts = [];
  try {
    if (/\.docx$/i.test(file.name)) parts = splitPassages(await docxText(file));
    else {
      const d = JSON.parse((await file.text()).replace(/^﻿/, ''));
      const list = Array.isArray(d) ? d : (d.quotes || []);
      parts = list.map(q => normTxtKeepLines(typeof q === 'string' ? q : q && q.text)).filter(Boolean);
    }
  } catch (e) { toast('讀不懂這個檔案，請選《這時候，深呼吸》的 Word 檔（.docx）', 'worried'); return; }
  if (!parts.length) { toast('檔案裡找不到段落', 'worried'); return; }
  addQuoteTexts(parts, true);
}
const normTxtKeepLines = s => String(s || '').replace(/\r/g, '').replace(/\n{3,}/g, '\n\n').trim();

  if (keyTime(ev)) return;
  if (ev.key === 'Escape') { closeTop(); return; }
  // 快速新增：按 Enter 加入（中文選字時的 Enter 不算）
  if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('qa-in') && !ev.isComposing && ev.keyCode !== 229) { ev.preventDefault(); quickAdd(ev.target.closest('.qa')); }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'certSearch') { UI.certQ = ev.target.value; render(); }
  if (ev.target.id === 'agSearch') { UI.agQ = ev.target.value; render(); }
  if (ev.target.id === 'syncInput') UI.syncInput = ev.target.value;
  if (ev.target.id === 'quoteBulk') UI.quoteBulk = ev.target.value;
  if (ev.target.id === 'gUrl') UI.gUrl = ev.target.value;
  if (ev.target.classList && ev.target.classList.contains('qa-in')) qaPreview(ev.target.closest('.qa'));
  if (ev.target.id === 'moodText') {
    const t = ev.target, d = t.dataset.date;
    UI.moodDraft = { date: d, text: t.value };
    const c = $('#moodCnt'); if (c) c.textContent = t.value.length;
    const st = $('#moodSt'); if (st) st.textContent = '';
    growMood(t);
    clearTimeout(UI.moodTimer); UI.moodTimer = setTimeout(() => saveMood(d, t.value), 1200);
  }
  if (ev.target.id === 'gInput') UI.gInput = ev.target.value;
  if (ev.target.type === 'date') updateWdHint(ev.target);
});
function updateWdHint(el) {
  const h = el.parentElement && el.parentElement.querySelector('.wd-hint');
  if (h) h.textContent = wdHint(el.value);
}
document.addEventListener('change', ev => {
  if (ev.target.type === 'date') updateWdHint(ev.target);
  if (ev.target.id === 'sndToggle') { prefs.snd = ev.target.checked; savePrefs(); if (ev.target.checked) chime(); }
  if (ev.target.id === 'agDone') { UI.agDone = ev.target.checked; render(); }
  if (ev.target.id === 'agPri') { UI.agPri = ev.target.checked; render(); }
  if (ev.target.id === 'importFile') handleImportFile(ev.target.files && ev.target.files[0]);
  if (ev.target.id === 'excelFile') handleExcelFile(ev.target.files && ev.target.files[0]);
  if (ev.target.id === 'quoteFile') handleQuoteFile(ev.target.files && ev.target.files[0]);
  if (ev.target.id === 'moodText') { clearTimeout(UI.moodTimer); saveMood(ev.target.dataset.date, ev.target.value); }
  if (ev.target.id === 'gScope' && gcal) { gcal.scope = ev.target.value; saveGcal(); toast(`之後從 Google 帶進來的行程會放在「${scopeOf(gcal.scope).t}」`, 'happy'); }
});
document.addEventListener('focusin', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.keytime === '1') { el.dataset.fresh = '1'; setTimeout(() => { try { if (document.activeElement === el) el.select(); } catch (e) {} }, 0); }
});
document.addEventListener('paste', ev => {
  const el = ev.target;
  if (!el.dataset || el.dataset.keytime !== '1' || el.disabled) return;
  ev.preventDefault();
  el.value = String((ev.clipboardData && ev.clipboardData.getData('text')) || '').trim().slice(0, 12); el.dataset.fresh = '';
  el.dispatchEvent(new Event('input', { bubbles: true }));
});
document.addEventListener('focusout', ev => {
  const el = ev.target;
  if (!el.classList || !el.classList.contains('time-in')) return;
  const t = normTime(el.value);
  if (t === null) el.setAttribute('aria-invalid', 'true');
  else { el.removeAttribute('aria-invalid'); el.value = t; }
});
window.addEventListener('storage', ev => { if (ev.key === DATA_KEY && loadData()) render(); });
window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); installEvt = ev; if (UI.view === 'settings') render(); });

/* ================= boot ================= */
if (!loadData()) { Object.assign(S, demoData()); saveData(); }
let incomingPair = null;
if ((location.hash || '').startsWith('#pair=')) {
  incomingPair = decodeURIComponent(location.hash.slice(6));
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
const hashView = (location.hash || '').replace('#', '');
UI.view = VIEWS[hashView] ? hashView : (VIEWS[prefs.view] ? prefs.view : 'today');
if (incomingPair) UI.view = 'settings';
render();
if (incomingPair) openPairIn(incomingPair);
else setTimeout(() => { maybeDaily(); checkNotices(); }, 900);
if (syncCfg) setTimeout(() => syncNow(false), 300);
else if (gReady()) setTimeout(() => gsyncNow(false), 1200);
setInterval(() => { if (syncCfg && !document.hidden) syncNow(false); }, 60000);
setInterval(() => { if (gReady() && !document.hidden && Date.now() - gs.last > 110000) gsyncNow(false); }, 30000);
window.addEventListener('online', () => { if (syncCfg) syncNow(false); else if (gReady()) gsyncNow(false); });
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
function tick() {
  const t = ymd(new Date());
  if (t !== TODAY) { TODAY = t; UI.sel = t; render(); }
  maybeDaily(); checkNotices();
}
setInterval(tick, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); if (!layers.length) render(); if (syncCfg) syncNow(false); else if (gReady() && Date.now() - gs.last > 30000) gsyncNow(false); } });
let lastMinute = nowHM();
setInterval(() => { const n = nowHM(); if (n !== lastMinute) { lastMinute = n; if (UI.view === 'today' && !layers.length) render(); } }, 60000);
})();
</script>
</body>
</html>
