<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>行動祕書</title>
<meta name="description" content="整合工作與個人的行動祕書：行程、待辦、認證申請、證書效期、每日提醒與週報月報。">
<meta name="theme-color" content="#E24A82">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="行動祕書">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a pocket planner — dot-grid paper, washi-tape bands mark certification periods, sticker mascots carry status; bottom tab bar on phones */
:root{
  --bg:#F2F4F9; --dot:#D6DCE9; --card:#FFFFFF; --card-2:#F6F7FB; --line:#E2E6F0;
  --ink:#252A40; --sub:#5F6782; --faint:#9CA3B8;
  --accent:#E24A82; --accent-tx:#B02A62; --accent-soft:#FFE4EF; --on:#FFFFFF;
  --mint:#22A884; --mint-tx:#11715A; --mint-soft:#DCF4EC;
  --sun:#F2B11B; --sun-tx:#8A5900; --sun-soft:#FFF0C7;
  --red:#E0434B; --red-tx:#B4232C; --red-soft:#FDE3E4;
  --sky:#3F7BE0; --sky-tx:#2459B5; --sky-soft:#E2ECFF;
  --lilac:#8A63E0; --lilac-tx:#6643B8; --lilac-soft:#EEE7FF;
  --peach:#F08A5D; --leaf:#4DAA57; --teal:#1A9BB0;
  --tape-1:#FFB8D2; --tape-2:#A6E6D3; --tape-3:#B6CEFF; --tape-4:#FFE08A; --tape-5:#D8C7FF; --tape-6:#FFC9A3; --tape-ink:#272A3C;
  --shadow:0 1px 2px rgba(37,42,64,.05),0 12px 28px -18px rgba(37,42,64,.35);
  --scrim:rgba(24,28,44,.42);
  --nav-h:64px;
  --f-display:"Huninn","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --f-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --f-num:"Fredoka","Huninn",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131722; --dot:#222939; --card:#1B2030; --card-2:#222838; --line:#2E3547;
    --ink:#EEF1F8; --sub:#A9B0C6; --faint:#79819A;
    --accent:#FF7AA8; --accent-tx:#FFA6C6; --accent-soft:#3B1F2D; --on:#2A0E19;
    --mint:#4FD3AE; --mint-tx:#7FE3C6; --mint-soft:#15332A;
    --sun:#F2C14E; --sun-tx:#F7D37E; --sun-soft:#382D10;
    --red:#FF6B70; --red-tx:#FF9A9D; --red-soft:#3D1B20;
    --sky:#7FAEFF; --sky-tx:#A9C8FF; --sky-soft:#1B2A46;
    --lilac:#B49BFF; --lilac-tx:#CDBDFF; --lilac-soft:#2A2346;
    --peach:#FFA27C; --leaf:#74C97D; --teal:#4FC3D6;
    --tape-1:#E99BB9; --tape-2:#86CDB8; --tape-3:#97B3E9; --tape-4:#E2C66F; --tape-5:#BAA6EC; --tape-6:#E6AD87; --tape-ink:#1C1E2C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -18px rgba(0,0,0,.7);
    --scrim:rgba(4,6,12,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131722; --dot:#222939; --card:#1B2030; --card-2:#222838; --line:#2E3547;
  --ink:#EEF1F8; --sub:#A9B0C6; --faint:#79819A;
  --accent:#FF7AA8; --accent-tx:#FFA6C6; --accent-soft:#3B1F2D; --on:#2A0E19;
  --mint:#4FD3AE; --mint-tx:#7FE3C6; --mint-soft:#15332A;
  --sun:#F2C14E; --sun-tx:#F7D37E; --sun-soft:#382D10;
  --red:#FF6B70; --red-tx:#FF9A9D; --red-soft:#3D1B20;
  --sky:#7FAEFF; --sky-tx:#A9C8FF; --sky-soft:#1B2A46;
  --lilac:#B49BFF; --lilac-tx:#CDBDFF; --lilac-soft:#2A2346;
  --peach:#FFA27C; --leaf:#74C97D; --teal:#4FC3D6;
  --tape-1:#E99BB9; --tape-2:#86CDB8; --tape-3:#97B3E9; --tape-4:#E2C66F; --tape-5:#BAA6EC; --tape-6:#E6AD87; --tape-ink:#1C1E2C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -18px rgba(0,0,0,.7);
  --scrim:rgba(4,6,12,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background-color:var(--bg);color:var(--ink);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);background-size:22px 22px;
  font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
}
body.locked{overflow:hidden}
[hidden]{display:none!important}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--sky-tx)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--sub)}
.app{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:12px 40px}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mascot{width:48px;height:48px;flex:none}
.eyebrow{font-family:var(--f-num);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--sub)}
h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:25px;line-height:1.15}
.tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.tab{border:0;background:transparent;padding:7px 13px;border-radius:999px;cursor:pointer;font-family:var(--f-display);font-size:14.5px;white-space:nowrap;color:var(--sub);display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .cnt{font-family:var(--f-num);font-size:11.5px;font-weight:600;background:var(--accent);color:var(--on);border-radius:999px;padding:0 6px;line-height:17px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.round{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);padding:0;flex:none}
.round svg{width:20px;height:20px}
.round[aria-current="page"]{border-color:var(--accent);color:var(--accent-tx)}
.round .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-family:var(--f-num);font-weight:600;font-size:11.5px;line-height:16px;text-align:center;border:2px solid var(--bg)}
.round.ring svg{animation:ring 2.4s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,70%,100%{transform:rotate(0)}74%{transform:rotate(14deg)}80%{transform:rotate(-12deg)}86%{transform:rotate(8deg)}92%{transform:rotate(-4deg)}}
.scope{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.scope button{border:0;background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-family:var(--f-display);color:var(--sub);white-space:nowrap;font-size:13.5px}
.scope button[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.add-wrap{position:relative}
.add-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px -18px rgba(0,0,0,.45);padding:6px;min-width:240px;display:flex;flex-direction:column}
.add-menu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px 10px;border-radius:12px;cursor:pointer;text-align:left}
.add-menu button:hover{background:var(--card-2)}
.add-menu .mascot{width:36px;height:36px;flex:none}
.add-menu b{display:block;font-family:var(--f-display);font-weight:400;font-size:14.5px}
.add-menu small{color:var(--sub);font-size:12px}
.bnav,.fab{display:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;cursor:pointer;font-family:var(--f-display);font-size:14px;line-height:1.25;white-space:nowrap;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--sub)}
.btn svg{width:15px;height:15px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red-tx);border-color:var(--red-soft);background:var(--red-soft)}
.btn.danger.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.ico{width:32px;height:32px;border-radius:50%;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--sub);flex:none;padding:0}
.ico:hover{background:var(--card-2);color:var(--ink)}
.ico svg{width:16px;height:16px}

/* ---------- panels & rows ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;margin:0 0 8px;flex-wrap:wrap}
.panel-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:17.5px;line-height:1.3}
.panel-h .n{font-family:var(--f-num);font-size:13px;color:var(--sub)}
.panel-h .act{margin-left:auto}
.panel-h .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--faint));flex:none}
.sub-h{font-family:var(--f-display);font-size:13.5px;color:var(--sub);margin:10px 0 2px;display:flex;align-items:center;gap:6px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;gap:10px;padding:10px 2px;border-top:1px dashed var(--line)}
.rows > .row:first-child{border-top:0}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);background:var(--card);cursor:pointer;display:grid;place-items:center;padding:0;margin-top:0;transition:transform .15s,background .15s,border-color .15s}
.tick svg{width:15px;height:15px;opacity:0;color:var(--on)}
.tick:hover{border-color:var(--mint);transform:scale(1.08)}
.tick.on{background:var(--mint);border-color:var(--mint)}
.tick.on svg{opacity:1;color:var(--on)}
.tick[disabled]{cursor:default;transform:none}
.row-ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.row-ic svg{width:15px;height:15px}
.row-ic.k-cert{background:var(--lilac-soft);color:var(--lilac-tx)}
.row-ic.k-certday{background:var(--sun-soft);color:var(--sun-tx)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row.is-done .row-title{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--mint);text-decoration-thickness:2px}
.row-meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--sub);margin-top:2px}
.row-meta .m{display:inline-flex;align-items:center;gap:3px;overflow-wrap:anywhere}
.row-meta .m svg{width:12px;height:12px;flex:none;opacity:.8}
.row-meta .sel{user-select:all}
.row-meta a.m{color:var(--sky-tx)}
.row-note{font-size:12.5px;color:var(--sub);margin-top:4px;padding:4px 8px;border-radius:8px;background:var(--card-2);white-space:pre-wrap;overflow-wrap:anywhere}
.row .stamp{width:40px;height:40px;flex:none;margin:-6px 0 -8px}
.star{color:var(--sun);margin-right:4px}
.rep-ic{display:inline-flex;vertical-align:-2px;margin-left:4px;color:var(--sub)}
.rep-ic svg{width:13px;height:13px}
.scope-p{font-family:var(--f-display);font-size:11px;padding:0 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent-tx)}
.scope-p.s-shinnyo{background:var(--lilac-soft);color:var(--lilac-tx)}
.field input:disabled{opacity:.4}
input.time-in[aria-invalid="true"]{border-color:var(--red)!important;background:var(--red-soft)!important}
.tag{flex:none;font-family:var(--f-display);font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;margin-top:2px}
.tag.overdue{background:var(--red-soft);color:var(--red-tx)}
.tag.today{background:var(--accent-soft);color:var(--accent-tx)}
.tag.soon{background:var(--sun-soft);color:var(--sun-tx)}
.tag.later{background:var(--card-2);color:var(--sub)}
.tag.done{background:var(--mint-soft);color:var(--mint-tx)}
.tag.watch{background:var(--sky-soft);color:var(--sky-tx)}
.cat i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.app-tag{display:inline-block;font-family:var(--f-display);font-size:11.5px;line-height:1.5;padding:0 7px;border-radius:4px;margin-right:6px;vertical-align:1px;color:var(--tape-ink);background-color:var(--tape);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.4) 0 4px,transparent 4px 8px)}
.empty{display:flex;align-items:center;gap:12px;color:var(--sub);padding:6px 0}
.empty .mascot{width:58px;height:58px;flex:none}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:15px}
.more{font-size:12px;color:var(--sub);padding:6px 2px 0}
.link-btn{border:0;background:none;color:var(--accent-tx);cursor:pointer;font-family:var(--f-display);padding:0;font-size:13px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1.5px dashed var(--sun);border-radius:16px;padding:8px 14px;margin-bottom:14px}
.banner .mascot{width:40px;height:40px;flex:none}
.banner p{margin:0;flex:1;min-width:200px}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- today ---------- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 20px;align-items:center;padding:18px 22px}
.hero > .mascot{width:104px;height:104px}
.hello{font-family:var(--f-display);font-size:27px;line-height:1.25;text-wrap:balance}
.today-date{font-family:var(--f-num);color:var(--sub);font-size:14px;margin-top:2px}
.summary{margin-top:6px;color:var(--sub);max-width:60ch}
.summary b{font-family:var(--f-num);color:var(--ink);font-weight:600;font-size:15px}
.slots{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.slots-h{font-size:12px;color:var(--sub);text-align:center}
.slot-row{display:flex;gap:6px}
.slot{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card-2);min-width:62px;cursor:pointer}
.slot .t{font-family:var(--f-num);font-weight:600;font-size:15px}
.slot .l{font-size:11.5px;color:var(--sub);white-space:nowrap}
.slot.past .t{color:var(--faint)}
.slot.next{border-color:var(--accent);background:var(--accent-soft)}
.slot.next .l{color:var(--accent-tx)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.mini-app{display:flex;flex-direction:column;gap:6px;padding:10px 0;border:0;border-top:1px dashed var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.mini-app:first-child{border-top:0}
.mini-top{display:flex;align-items:center;gap:8px;min-width:0}
.mini-top .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.mini-top .left{font-family:var(--f-num);font-size:12.5px;color:var(--sub);white-space:nowrap}
.mini-next{font-size:12.5px;color:var(--sub)}
.prog{height:8px;border-radius:4px;background:var(--card-2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;border-radius:4px;background:var(--mint)}

/* ---------- agenda ---------- */
.ag-day{margin-bottom:14px}
.ag-head{display:flex;align-items:baseline;gap:8px;padding:0 4px 6px}
.ag-head b{font-family:var(--f-display);font-weight:400;font-size:16px}
.ag-head span{font-size:12.5px;color:var(--sub)}
.ag-day .panel{padding:4px 16px}
.chk-inline{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13.5px}
.chk-inline input{width:17px;height:17px;accent-color:var(--accent)}

/* ---------- calendar ---------- */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .grow{flex:1}
.month-title{font-family:var(--f-display);font-size:22px;min-width:130px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:22px;height:9px;border-radius:3px;background-color:var(--tape-1);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.45) 0 3px,transparent 3px 6px)}
.legend svg{width:13px;height:13px}
.cal{--dh:30px;--lh:20px;--ch:58px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--card-2)}
.cal-head div{padding:7px 8px;font-family:var(--f-display);font-size:13px;color:var(--sub)}
.cal-head div.we{color:var(--accent-tx)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.dbg{grid-row:1/-1;border:0;border-left:1px solid var(--line);background:transparent;cursor:pointer;padding:0;min-width:0;border-radius:0}
.dbg.c1{border-left:0}
.dbg:hover{background:var(--card-2)}
.dbg.out{background:var(--card-2)}
.dbg.is-today{background:var(--accent-soft)}
.dbg.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dbg:focus-visible{outline-offset:-3px}
.dnum{grid-row:1;z-index:1;pointer-events:none;padding:5px 8px 0;font-family:var(--f-num);font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:6px;min-width:0}
.dnum.out{color:var(--faint)}
.dnum .tdot{font-family:var(--f-display);font-size:10.5px;font-weight:400;background:var(--accent);color:var(--on);border-radius:999px;padding:0 6px;line-height:16px}
.band{z-index:2;margin:2px 0;border:0;padding:0 7px;font-family:var(--f-display);font-size:11.5px;line-height:1;color:var(--tape-ink);background-color:var(--tape);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.42) 0 5px,transparent 5px 10px);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;cursor:pointer;min-width:0;text-align:left;border-radius:0}
.band.rs{margin-left:5px;border-top-left-radius:8px;border-bottom-left-radius:8px}
.band.re{margin-right:5px;border-top-right-radius:8px;border-bottom-right-radius:8px}
.band span{overflow:hidden;text-overflow:ellipsis}
.band svg{width:12px;height:12px;flex:none}
.band .end{margin-left:auto}
.band.st-paused,.band.st-cancelled{filter:grayscale(1);opacity:.55}
.dchips{display:flex;flex-direction:column;gap:3px;padding:3px 5px 7px;min-width:0;pointer-events:none;z-index:1}
.chip{display:flex;align-items:center;gap:4px;font-size:11.5px;line-height:1.4;padding:1px 6px 1px 5px;border-radius:6px;background:var(--card-2);color:var(--ink);overflow:hidden;white-space:nowrap;min-width:0}
.chip i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}

.daypanel .period{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:10px;background:var(--card-2);margin-bottom:6px}
.tape-sw{width:20px;height:10px;border-radius:3px;flex:none;background-color:var(--tape);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.45) 0 3px,transparent 3px 6px)}

/* ---------- certification ---------- */
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 13px;cursor:pointer;font-family:var(--f-display);color:var(--sub);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .c{font-family:var(--f-num);font-size:12px;margin-left:3px}
.apps-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,500px),1fr));gap:22px 18px;padding-top:8px}
.app-card{position:relative;padding-top:22px}
.app-card::before{content:"";position:absolute;top:-9px;left:24px;width:96px;height:22px;transform:rotate(-3deg);border-radius:2px;opacity:.95;background-color:var(--tape);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.42) 0 5px,transparent 5px 10px)}
.app-head{display:flex;align-items:flex-start;gap:10px}
.app-head .mascot{width:54px;height:54px;flex:none;margin-top:-6px}
.app-head .ttl{flex:1;min-width:0}

.app-meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--sub);font-size:12.5px;margin-top:10px}
.app-meta .m{display:inline-flex;align-items:center;gap:4px;overflow-wrap:anywhere}

.tl{margin:18px 0 4px}
.tl-track{position:relative;height:16px;border-radius:8px;background:var(--card-2);border:1px solid var(--line)}
.tl-fill{position:absolute;top:0;bottom:0;left:0;border-radius:8px;background-color:var(--tape);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.42) 0 5px,transparent 5px 10px)}
.tl-dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2.5px solid var(--card);background:var(--faint);z-index:1}
.tl-dot.done{background:var(--mint)}
.tl-dot.overdue{background:var(--red)}
.tl-dot.soon,.tl-dot.today{background:var(--sun)}
.tl-now{position:absolute;top:-7px;bottom:-7px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px;z-index:2}
.tl-now::after{content:"今天";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-size:10.5px;color:var(--ink);white-space:nowrap}
.tl-labels{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
.tl-labels b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.app-prog{display:flex;align-items:center;gap:10px;margin:12px 0 2px;font-size:13px}
.app-prog .prog{flex:1}
.app-prog b{font-family:var(--f-num);font-weight:600}
.stickers{display:flex;gap:2px;flex-wrap:wrap}
.stickers .stamp{width:26px;height:26px}
.stickers .pend{width:26px;height:26px;display:grid;place-items:center}
.stickers .pend i{width:12px;height:12px;border-radius:50%;border:2px dashed var(--faint)}
.app-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);min-width:0}

.tile.t-red .v{color:var(--red-tx)}
.tile.t-sun .v{color:var(--sun-tx)}
.tile.t-sky .v{color:var(--sky-tx)}
.tile.t-mint .v{color:var(--mint-tx)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-width:0;flex:1;max-width:380px;box-shadow:var(--shadow)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;color:var(--sub);font-weight:500;padding:8px 14px;background:var(--card-2);white-space:nowrap}

td.wrap{white-space:normal;min-width:140px;color:var(--sub);font-size:12.5px}
tbody tr:hover td{background:var(--card-2)}
td.proj{font-weight:700}

/* ---------- report ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);min-width:0}

.chart-box{overflow-x:auto}
.chart-svg{width:100%;height:auto;display:block}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--sub);font-family:var(--f-num);font-size:11px}
.ax.sm{font-size:10px}
.ax.now{fill:var(--accent-tx);font-weight:600}
.b-done{fill:var(--mint)}
.b-open{fill:var(--sun)}
.b-open.late{fill:var(--red)}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:6px;flex-wrap:wrap}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.catbars{display:flex;flex-direction:column;gap:8px}
.catbar{display:grid;grid-template-columns:84px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.catbar .trk{height:12px;border-radius:6px;background:var(--card-2);overflow:hidden;display:flex;border:1px solid var(--line)}

.catbar .c{font-family:var(--f-num);color:var(--sub);text-align:right}
.rep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}

/* ---------- settings ---------- */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.set-grid .panel p{margin:0 0 10px;color:var(--sub)}
.set-acts{display:flex;flex-wrap:wrap;gap:8px}
.set-list{margin:0;padding-left:20px;color:var(--sub)}
.set-list li{margin-bottom:4px}
.stat-line{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--sub);margin-bottom:10px}
.stat-line b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.file-btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---------- layers ---------- */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:45;backdrop-filter:blur(2px)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,calc(100vw - 24px));max-height:calc(100dvh - 32px);overflow:auto;background:var(--card);border-radius:24px;box-shadow:0 30px 80px -24px rgba(0,0,0,.5);z-index:55;padding:20px 22px;animation:rise .22s ease-out;overscroll-behavior:contain}
.modal.slot{z-index:52;width:min(500px,calc(100vw - 24px));padding:0}
@keyframes rise{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
.sheet-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sheet-h .mascot{width:56px;height:56px;flex:none}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px}
.sheet-h p{margin:2px 0 0;color:var(--sub);font-size:13px}
.sheet-h .x{margin-left:auto;align-self:flex-start}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 14px}
.form-grid .full{grid-column:1/-1}
.fsec{grid-column:1/-1;font-family:var(--f-display);font-size:14px;color:var(--accent-tx);margin-top:6px;display:flex;align-items:center;gap:8px}
.fsec::after{content:"";flex:1;height:1px;background:var(--line)}
.field{min-width:0}
.field > label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea{width:100%;background:var(--card-2);border:1.5px solid var(--line);border-radius:12px;padding:8px 11px;outline:0;min-width:0;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:12px;color:var(--faint);margin-top:3px}
.req{color:var(--accent-tx)}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-top:22px}
.checks label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin:0;color:var(--ink);font-size:14px}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.radio-seg{display:flex;gap:6px}
.radio-seg label{flex:1;cursor:pointer;margin:0}
.radio-seg input{position:absolute;opacity:0;pointer-events:none}
.radio-seg span{display:block;text-align:center;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--card-2);font-family:var(--f-display)}
.radio-seg input:checked + span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-tx)}
.radio-seg input:focus-visible + span{outline:2.5px solid var(--accent);outline-offset:2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{cursor:pointer;margin:0}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches span{display:block;width:40px;height:24px;border-radius:5px;border:2px solid transparent;background-color:var(--tape);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.45) 0 4px,transparent 4px 8px)}
.swatches input:checked + span{border-color:var(--ink);transform:rotate(-4deg)}
.swatches input:focus-visible + span{outline:2.5px solid var(--accent);outline-offset:2px}
.steps-ed{display:flex;flex-direction:column;gap:8px}
.step-ed{display:grid;grid-template-columns:150px 110px minmax(0,1fr) auto auto;gap:6px;align-items:center;background:var(--card-2);border-radius:12px;padding:6px}
.step-ed input:not([type=checkbox]){background:var(--card)!important;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;min-width:0;font-size:15px}
.step-ed .dn{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--sub);white-space:nowrap}
.step-ed .dn input{width:17px;height:17px;accent-color:var(--mint)}
.steps-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.form-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.form-foot .left{margin-right:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);background:var(--bg);z-index:50;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:-24px 0 60px -30px rgba(0,0,0,.55);animation:slide .25s ease-out;overscroll-behavior:contain}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drawer .panel{margin-bottom:14px}
.slot-top{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:24px 24px 0 0;background:var(--slot-bg)}
.slot-top .mascot{width:92px;height:92px;flex:none}
.slot-top .t{font-family:var(--f-num);font-weight:600;font-size:14px;color:var(--sub)}
.slot-top h2{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.3}
.slot-top p{margin:4px 0 0;color:var(--sub);font-size:13px}
.slot-body{padding:6px 20px 4px}
.sl-sec h3{font-family:var(--f-display);font-weight:400;font-size:15px;margin:12px 0 2px;display:flex;align-items:center;gap:6px}
.sl-sec h3 .n{font-family:var(--f-num);font-size:12.5px;color:var(--sub)}
.slot-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px;flex-wrap:wrap}

/* ---------- toasts & celebration ---------- */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:18px;padding:6px 16px 6px 8px;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);animation:tin .3s ease-out;max-width:420px;font-size:13.5px}
.toast .mascot{width:40px;height:40px;flex:none}
.toast.out{opacity:0;transform:translateY(8px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.pop{position:fixed;z-index:80;width:96px;height:96px;margin:-48px 0 0 -48px;pointer-events:none}
.pop .stamp{width:96px;height:96px;animation:stampin 1.15s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes stampin{0%{transform:scale(.2) rotate(-40deg);opacity:0}22%{transform:scale(1.18) rotate(4deg);opacity:1}38%{transform:scale(1) rotate(0)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-26px) scale(.9)}}
.cf{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;animation:cf .9s ease-out forwards}
@keyframes cf{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}
.st-bg{fill:var(--mint-soft);stroke:var(--mint);stroke-width:3}
.st-ring{fill:none;stroke:var(--mint);stroke-width:1.3;stroke-dasharray:2 3}
.st-tx{fill:var(--mint-tx);font-family:var(--f-display);font-size:16px}
.st-star{fill:var(--mint)}
.stamp.cert .st-bg{fill:var(--sun-soft);stroke:var(--sun)}
.stamp.cert .st-ring{stroke:var(--sun)}
.stamp.cert .st-tx{fill:var(--sun-tx)}
.stamp.cert .st-star{fill:var(--sun)}
.mascot{display:block;overflow:visible}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.foot{margin-top:28px;font-size:12.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;text-align:center}
.foot b{font-family:var(--f-num);color:var(--ink);font-weight:500}

/* ---------- responsive ---------- */
@media (max-width:1020px){

}

}

  .brand .mascot{width:40px;height:40px}
  .tabs,#addBtn,.foot{display:none}

  .scope button{flex:1}
  .hero{grid-template-columns:auto minmax(0,1fr);padding:16px}
  .hero > .mascot{width:72px;height:72px}
  .hello{font-size:21px}

  .tiles,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px -20px rgba(0,0,0,.4)}
  .bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;color:var(--sub);font-family:var(--f-display);font-size:11.5px;position:relative;border-radius:12px}
  .bnav button svg{width:22px;height:22px}
  .bnav button[aria-current="page"]{color:var(--accent-tx)}
  .bnav button[aria-current="page"] svg{stroke-width:2.4}
  .bnav .cnt{position:absolute;top:0;left:calc(50% + 6px);font-family:var(--f-num);font-size:10.5px;font-weight:600;background:var(--accent);color:var(--on);border-radius:999px;padding:0 5px;line-height:15px}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:41;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--on);box-shadow:0 12px 26px -10px rgba(226,74,130,.7);cursor:pointer}
  .fab svg{width:26px;height:26px}
  .add-menu{position:fixed;top:auto;right:16px;bottom:calc(var(--nav-h) + 86px + env(safe-area-inset-bottom,0px))}
  .toasts{bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px))}
  .modal{top:auto;bottom:0;left:0;right:0;transform:none;width:100%;max-height:92dvh;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:sheet .25s ease-out}
  .modal.slot{width:100%;padding:0 0 env(safe-area-inset-bottom,0px)}
  @keyframes sheet{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .checks{padding-top:2px}
  .step-ed{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

}
@media (max-width:640px){
  .cal{--dh:26px;--lh:7px;--ch:20px;border-radius:16px}

  .dnum .tdot{display:none}
  .band span,.band svg{display:none}

  .band.rs{border-radius:3px 0 0 3px;margin-left:3px}

  .month-title{font-size:19px;min-width:0}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="app">
  <header class="top">

      <span id="brandMascot"></span>
      <div>
        <div class="eyebrow">Mobile Secretary</div>
        <h1>行動祕書</h1>

function vCalendar() {
  const m0 = UI.month; const first = parse(m0);
  const y = first.getFullYear(), m = first.getMonth();
  const last = ymd(new Date(y, m + 1, 0));
  const start = addDays(m0, -((first.getDay() + 6) % 7));
  const weeks = []; for (let w = start; w <= last; w = addDays(w, 7)) weeks.push(w);
  const byDate = {};
  for (const e of EV) if (scopeOk(e)) (byDate[e.date] = byDate[e.date] || []).push(e);
  const apps = !workVisible() ? [] : S.apps.filter(a => isDate(a.applyDate) && isDate(endOf(a)) && a.applyDate <= endOf(a)).map(a => ({ a, s: a.applyDate, e: endOf(a) }));
  let html = '';
  for (const ws of weeks) {
    const we = addDays(ws, 6);
    const segs = apps.filter(x => x.s <= we && x.e >= ws)
      .map(x => Object.assign({}, x, { cs: x.s < ws ? 0 : diff(ws, x.s), ce: x.e > we ? 6 : diff(ws, x.e) }))
      .sort((p, q) => p.cs - q.cs || (q.ce - q.cs) - (p.ce - p.cs));
    const laneEnd = [];
    segs.forEach(sg => { let L = laneEnd.findIndex(end => end < sg.cs); if (L < 0) { L = laneEnd.length; laneEnd.push(-1); } laneEnd[L] = sg.ce; sg.lane = L; });
    const lanes = Math.min(laneEnd.length, 4);
    html += `<div class="week" style="grid-template-rows:var(--dh) ${lanes ? `repeat(${lanes},var(--lh))` : ''} minmax(var(--ch),auto)">`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(ws, i); const out = d.slice(0, 7) !== m0.slice(0, 7);
      html += `<button class="dbg c${i + 1} ${out ? 'out' : ''} ${d === TODAY ? 'is-today' : ''} ${d === UI.sel ? 'sel' : ''}" style="grid-column:${i + 1}" data-act="pick" data-date="${d}" aria-label="${full(d)}"></button>`;
      html += `<div class="dnum ${out ? 'out' : ''}" style="grid-column:${i + 1}">${parse(d).getDate()}${d === TODAY ? '<span class="tdot">今天</span>' : ''}</div>`;
      const list = (byDate[d] || []);
      html += `<div class="dchips" style="grid-column:${i + 1};grid-row:${lanes + 2}">${list.slice(0, 3).map(chip).join('')}${list.length > 3 ? `<span class="chip more-chip">＋${list.length - 3} 項</span>` : ''}</div>`;
    }
    segs.filter(sg => sg.lane < 4).forEach(sg => {
      const a = sg.a; const rs = sg.s >= ws, re = sg.e <= we; const st = a.status || 'active';
      const tip = `${appName(a)}｜申請 ${md(sg.s)} → ${st === 'obtained' ? '取證' : '預計取證'} ${md(sg.e)}`;
      html += `<button class="band ${rs ? 'rs' : ''} ${re ? 're' : ''} st-${st}" style="grid-column:${sg.cs + 1}/${sg.ce + 2};grid-row:${sg.lane + 2};--tape:var(--tape-${a.color || 1})" data-act="edit" data-key="app:${esc(a.id)}" title="${esc(tip)}" aria-label="${esc(tip)}">${rs ? IC.doc : ''}<span>${esc(appName(a))}</span>${re ? `<span class="end">${IC.medal}</span>` : ''}</button>`;
    });
    html += `</div>`;
  }
  const heads = ['一', '二', '三', '四', '五', '六', '日'].map((d, i) => `<div class="${i > 4 ? 'we' : ''}">${d}</div>`).join('');
  return `
  <div class="toolbar">
    <button class="ico" data-act="cal-prev" aria-label="上個月">${IC.left}</button>
    <div class="month-title">${y} 年 ${m + 1} 月</div>
    <button class="ico" data-act="cal-next" aria-label="下個月">${IC.right}</button>
    <button class="btn sm" data-act="cal-today">今天</button>
    <div class="grow"></div>
    <div class="legend">
      <span><span class="sw"></span>認證期間</span>
      <span>${IC.medal}取證日</span>
      <span><span style="width:9px;height:9px;border-radius:50%;background:var(--lilac)"></span>證書到期</span>
      <span><span style="width:12px;height:9px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--sun)"></span>兩天內</span>
      <span><span style="width:12px;height:9px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--red)"></span>逾期</span>
    </div>
  </div>
  <div class="cal-wrap">
    <div class="cal"><div class="cal-head">${heads}</div>${html}</div>

}

function appCard(a) {

  else { body = sec('今天沒做完的', pend, '今天全數完成，辛苦了！') + sec('明天預告', tmr) + sec('後天預告', aft); note = `今天完成 ${doneN}／${todays.length} 件`; }

function maybeSlot(onLoad) {
  const hm = nowHM();
  const passed = SLOTS.filter(s => s.t <= hm); if (!passed.length) return;
  const s = passed[passed.length - 1];
  const key = `msec.slot:${TODAY}:${s.k}`;
  if (shownSlots.has(key) || ls.get(key)) return;
  shownSlots.add(key); ls.set(key, '1');

  const mins = now.getHours() * 60 + now.getMinutes() - (h * 60 + m);

  const sm = slotSummary();
  sysNotify(`${s.t} ${s.name}提醒`, `今天待辦 ${sm.pend.length} 件・兩天內 ${sm.tmr.length + sm.aft.length} 件${sm.od.length ? `・逾期 ${sm.od.length} 件` : ''}`);
}
let audioCtx = null;
function chime() {
  if (prefs.snd === false) return;
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    audioCtx = audioCtx || new A();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    [[784, 0], [1046.5, .14], [1318.5, .28]].forEach(([f, dt]) => {

}

// 手動輸入的時間 → "HH:MM"；空白回傳 ''，看不懂回傳 null。接受 930、0930、9.30、9:30、14、下午2點半、晚上7點15分
function normTime(raw) {
  let s = String(raw || '').trim().replace(/\s+/g, '');
  if (!s) return '';

  s = s.replace(/下午|晚上|傍晚|上午|早上|凌晨|中午|am|pm/ig, '').replace(/[：.．。,，]/g, ':')
    .replace(/點半$/, ':30').replace(/點(\d{1,2})分?$/, ':$1').replace(/點$/, '');
  let h, m, mm;

  else if (/^\d{1,4}$/.test(s)) { if (s.length <= 2) { h = +s; m = 0; } else { h = +s.slice(0, -2); m = +s.slice(-2); } }

function downloadFile(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function shareOrDownload(filename, text, type) {
  try {
    if (navigator.canShare && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const file = new File([text], filename, { type });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return; }
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  downloadFile(filename, text, type);
}

      <div class="form-foot"><button class="btn ghost" data-act="close">取消</button><button class="btn danger" data-act="import-replace">取代全部</button><button class="btn primary" data-act="import-merge">合併匯入</button></div>`;

/* --- iCalendar --- */
const icsText = s => String(s || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
function icsFold(line) {
  const out = []; let cur = ''; let bytes = 0;
  for (const ch of line) {
    const b = new TextEncoder().encode(ch).length;
    if (bytes + b > 73) { out.push(cur); cur = ' '; bytes = 1; }
    cur += ch; bytes += b;
  }
  out.push(cur); return out.join('\r\n');
}
const icsDate = d => d.replace(/-/g, '');
const icsStamp = () => new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
function vevent({ uid: u, date, time, endTime, summary, desc, location, url, rrule, alarms, durMin = 30 }) {
  const L = ['BEGIN:VEVENT', `UID:${u}@mobile-secretary`, `DTSTAMP:${icsStamp()}`];
  if (time) {
    L.push(`DTSTART:${icsDate(date)}T${time.replace(':', '')}00`);
    L.push(endTime && endTime > time ? `DTEND:${icsDate(date)}T${endTime.replace(':', '')}00` : `DURATION:PT${durMin}M`);
  }
  else { L.push(`DTSTART;VALUE=DATE:${icsDate(date)}`, `DTEND;VALUE=DATE:${icsDate(addDays(date, 1))}`); }
  if (rrule) L.push(`RRULE:${rrule}`);
  L.push(`SUMMARY:${icsText(summary)}`);
  if (desc) L.push(`DESCRIPTION:${icsText(desc)}`);
  if (location) L.push(`LOCATION:${icsText(location)}`);
  if (url) L.push(`URL:${url}`);
  (alarms || []).forEach(t => L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsText(summary)}`, `TRIGGER:${t}`, 'END:VALARM'));
  L.push('END:VEVENT');
  return L;
}
function icsWrap(events, name) {
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Mobile Secretary//ZH-TW', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', `X-WR-CALNAME:${icsText(name)}`, ...events.flat(), 'END:VCALENDAR'].map(icsFold).join('\r\n') + '\r\n';
}
const appUrl = () => location.protocol.startsWith('http') ? location.href.split('#')[0] : '';
function exportEventsICS() {
  const hi = addDays(TODAY, 180); const evs = []; const seen = new Set();
  const twoDays = t => t ? '-P2D' : '-P1DT15H';
  const dayOf = t => t ? '-PT15M' : 'PT9H';
  for (const it of S.items) {
    if (!isDate(it.date)) continue;
    const base = { desc: [it.cat && `類別：${it.cat}`, it.target && `對象：${it.target}`, it.company && `公司：${it.company}`, it.phone && `電話：${it.phone}`, it.link && `連結：${it.link}`, it.note].filter(Boolean).join('\n'), location: it.location, url: appUrl() };
    const sc = it.scope || 'work';
    const summary = `${sc === 'personal' ? '' : `【${scopeOf(sc).t}】`}${it.title}`;
    const time = it.allDay ? '' : (it.time || ''), endTime = it.allDay ? '' : (it.endTime || '');
    if (isRep(it)) {
      if (isDate(it.until) && it.until < TODAY) continue;
      const freq = { daily: 'FREQ=DAILY', weekdays: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly: 'FREQ=WEEKLY', monthly: 'FREQ=MONTHLY', yearly: 'FREQ=YEARLY' }[it.repeat];
      const rr = freq + (isDate(it.until) ? `;UNTIL=${icsDate(it.until)}T235959` : '');
      const al = ['monthly', 'yearly'].includes(it.repeat) ? [twoDays(time), dayOf(time)] : [time ? 'PT0M' : 'PT9H'];
      evs.push(vevent(Object.assign({ uid: 'item-' + it.id, date: it.date, time, endTime, summary, rrule: rr, alarms: al }, base)));
    } else {
      if (it.done || it.date < TODAY || it.date > hi) continue;
      evs.push(vevent(Object.assign({ uid: 'item-' + it.id, date: it.date, time, endTime, summary, alarms: [twoDays(time), dayOf(time)] }, base)));
    }
  }
  for (const a of S.apps) {
    if (!isLive(a)) continue;
    (a.steps || []).forEach(st => {
      if (!isDate(st.date) || st.done || st.date < TODAY || st.date > hi) return;
      evs.push(vevent({ uid: `step-${a.id}-${st.id}`, date: st.date, time: st.time, summary: `【認證】${appName(a)}｜${st.title}`, desc: [a.company && `實驗室：${a.company}`, a.target && `窗口：${a.target}`, a.phone && `電話：${a.phone}`].filter(Boolean).join('\n'), url: appUrl(), alarms: [twoDays(st.time), dayOf(st.time)] }));
    });
    if (isDate(a.certDate) && a.certDate >= TODAY && a.certDate <= hi) evs.push(vevent({ uid: 'certday-' + a.id, date: a.certDate, summary: `【取證日】${appName(a)}`, url: appUrl(), alarms: [twoDays(''), dayOf('')] }));
  }
  for (const c of S.certs) {
    if (!isDate(c.due) || certLvl(c) === 'retired' || c.due < TODAY) continue;
    if (seen.has(c.id)) continue; seen.add(c.id);
    evs.push(vevent({ uid: 'cert-' + c.id, date: c.due, summary: `【證書到期】${c.project}｜${c.cert}`, desc: c.no ? `證書編號：${c.no}` : '', url: appUrl(), alarms: ['-P89DT15H', '-P29DT15H', '-P1DT15H'] }));
  }
  if (!evs.length) { toast('目前沒有需要匯出的行程', 'calm', 'sky'); return; }
  shareOrDownload(`行動祕書_行程_${TODAY}.ics`, icsWrap(evs, '行動祕書'), 'text/calendar');
  toast(`已產生 ${evs.length} 筆行事曆項目，開啟後選「加入全部」`, 'happy', 'sky', 'bell');
}

}

function todayPendingCount() { return EV.filter(e => e.date === TODAY && e.k !== 'cert' && e.live && !e.done).length; }
function toggle(btn) {
  const f = findByKey(btn.dataset.key);
  if (f.k === 'item' && f.it) {
    const it = f.it;
    if (isRep(it)) {
      const d = f.date; const dd = Object.assign({}, it.doneDates || {}); const done = !dd[d];
      const lastToday = done && d === TODAY && todayPendingCount() === 1;
      if (done) { dd[d] = iso(); celebrate(btn, it.title); } else delete dd[d];
      Store.patch('items', it.id, { doneDates: dd });
      if (lastToday) setTimeout(() => toast('今日待辦全部完成！給自己一個大大的讚', 'happy', 'mint', 'cert'), 900);
      return;
    }
    const done = !it.done;
    const lastToday = done && it.date === TODAY && todayPendingCount() === 1;
    if (done) celebrate(btn, it.title);
    Store.patch('items', it.id, { done, doneAt: done ? iso() : null });
    if (lastToday) setTimeout(() => toast('今日待辦全部完成！給自己一個大大的讚', 'happy', 'mint', 'cert'), 900);
  } else if (f.k === 'step' && f.app) {
    const a = f.app; const st = (a.steps || []).find(s => s.id === f.stepId); if (!st) return;
    const done = !st.done;
    const lastToday = done && st.date === TODAY && todayPendingCount() === 1;
    const steps = (a.steps || []).map(s => s.id === f.stepId ? Object.assign({}, s, { done, doneAt: done ? iso() : null }) : Object.assign({}, s));
    if (done) celebrate(btn, `${appName(a)}｜${st.title}`);
    Store.patch('apps', a.id, { steps, updatedAt: iso() });
    if (done && steps.every(s => s.done)) setTimeout(() => toast(`「${appName(a)}」所有提交節點都完成了，就等取證！`, 'happy', 'pink', 'cert'), 900);
    else if (lastToday) setTimeout(() => toast('今日待辦全部完成！給自己一個大大的讚', 'happy', 'mint', 'cert'), 900);
  }
}

  const txt = reportText();
  try {
    await navigator.clipboard.writeText(txt);
    toast('報表文字已複製，可以直接貼到郵件或 Teams', 'happy', 'sky', 'doc');
  } catch (e) {
    const m = $('#modal'); m.setAttribute('aria-label', '報表文字');
    m.innerHTML = `<div class="sheet-h">${mascot('calm', 'sky', 'doc')}<div><h2>報表文字</h2><p>已幫你全選，請按複製</p></div><button type="button" class="ico x" data-act="close" aria-label="關閉">${IC.x}</button></div><div class="field"><textarea id="repText" readonly style="min-height:320px;font-size:13px">${esc(txt)}</textarea></div>`;
    openLayer(m); const ta = $('#repText'); ta.focus(); ta.select();
  }
}
function exportCSV() {
  const R = range();
  shareOrDownload(`${scopeWord()}${R.title}_${R.s}_${R.e}.csv`, reportCSV(), 'text/csv');
}
function insertTemplate() {
  const box = $('#fa-steps');
  const a = val('fa-apply'), c = val('fa-cert');
  const span = isDate(a) && isDate(c) && c >= a ? diff(a, c) : null;
  STEP_TPL.forEach(([f, t], i) => {
    const d = span != null ? addDays(a, Math.round(span * f)) : addDays(TODAY, [0, 3, 7, 14, 21, 28][i]);
    box.insertAdjacentHTML('beforeend', stepRow({ id: uid('s'), date: d, title: t }));
  });
  toast('已加入 6 個常用節點，可以再調整日期與內容', 'happy', 'sun', 'doc');
}
function closeAddMenu() { $('#addMenu').hidden = true; $('#addBtn').setAttribute('aria-expanded', 'false'); }

const ACT = {
  tab: b => go(b.dataset.view),
  'go-cert': b => { UI.certTab = b.dataset.tab || 'apps'; go('cert'); },
  scope: b => { UI.scope = b.dataset.s; prefs.scope = UI.scope; savePrefs(); render(); },
  'add-menu': () => { const m = $('#addMenu'); m.hidden = !m.hidden; $('#addBtn').setAttribute('aria-expanded', String(!m.hidden)); },
  'new-item': b => { closeAddMenu(); openItemForm(null, b.dataset.date, b.dataset.scope); },
  'new-app': () => { closeAddMenu(); openAppForm(null); },
  'new-cert': () => { closeAddMenu(); openCertForm(null); },
  drawer: () => { fillDrawer(); openLayer($('#drawer')); },
  close: b => closeLayer(b.closest('.layer')),
  toggle: b => toggle(b),
  edit: b => openEdit(b.dataset.key),
  del: b => doDelete(b),
  pick: b => { UI.sel = b.dataset.date; render(); },
  'cal-prev': () => { const d = parse(UI.month); UI.month = ymd(new Date(d.getFullYear(), d.getMonth() - 1, 1)); render(); },
  'cal-next': () => { const d = parse(UI.month); UI.month = ymd(new Date(d.getFullYear(), d.getMonth() + 1, 1)); render(); },
  'cal-today': () => { UI.month = TODAY.slice(0, 8) + '01'; UI.sel = TODAY; render(); },
  'cert-tab': b => { UI.certTab = b.dataset.t; render(); },
  'app-filter': b => { UI.appFilter = b.dataset.f; render(); },
  'app-obtain': b => { const a = S.apps.find(x => x.id === b.dataset.id); if (a) openAppForm(a, { status: 'obtained', actualCertDate: a.actualCertDate || TODAY, focus: 'fa-expiry' }); },
  'ag-days': b => { UI.agDays = Number(b.dataset.n); render(); },
  slot: b => { const s = SLOTS.find(x => x.k === b.dataset.k); if (s) openSlot(s, false); },
  'slot-go': () => go('today'),
  'rep-mode': b => { UI.repMode = b.dataset.m; render(); },
  'rep-prev': () => { const d = parse(UI.repAnchor); UI.repAnchor = UI.repMode === 'week' ? addDays(UI.repAnchor, -7) : ymd(new Date(d.getFullYear(), d.getMonth() - 1, 1)); render(); },
  'rep-next': () => { const d = parse(UI.repAnchor); UI.repAnchor = UI.repMode === 'week' ? addDays(UI.repAnchor, 7) : ymd(new Date(d.getFullYear(), d.getMonth() + 1, 1)); render(); },
  'rep-now': () => { UI.repAnchor = TODAY; render(); },
  'rep-copy': () => copyReport(),
  'rep-csv': () => exportCSV(),
  'step-add': () => { $('#fa-steps').insertAdjacentHTML('beforeend', stepRow({ id: uid('s'), date: TODAY })); const r = $$('#fa-steps .se-title'); r[r.length - 1].focus(); },
  'step-tpl': () => insertTemplate(),
  'step-del': b => b.closest('.step-ed').remove(),
  'clear-samples': b => clearSamples(b),
  'clear-all': b => clearAll(b),
  backup: () => backup(),
  import: () => { const f = $('#importFile'); f.value = ''; f.click(); },
  'import-merge': () => applyImport('merge'),
  'import-replace': b => arm(b, '確定取代？再按一次', () => applyImport('replace')),
  'ics-events': () => exportEventsICS(),
  'ics-daily': () => exportDailyICS(),
  notify: () => enableNotify(),
  install: async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; render(); }
};
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!$('#addMenu').hidden && !ev.target.closest('#addWrap') && !ev.target.closest('#fab')) closeAddMenu();
  if (!b) return;
  const fn = ACT[b.dataset.act];
  if (fn) { ev.preventDefault(); fn(b, ev); }
});
$('#overlay').addEventListener('click', closeTop);
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (!$('#addMenu').hidden) { closeAddMenu(); return; } closeTop(); }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'certSearch') { UI.certQ = ev.target.value; render(); }
  if (ev.target.id === 'agSearch') { UI.agQ = ev.target.value; render(); }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'sndToggle') { prefs.snd = ev.target.checked; savePrefs(); if (ev.target.checked) chime(); }
  if (ev.target.id === 'agDone') { UI.agDone = ev.target.checked; render(); }
  if (ev.target.id === 'importFile') handleImportFile(ev.target.files && ev.target.files[0]);
});
document.addEventListener('focusout', ev => {
  const el = ev.target;
  if (!el.classList || !el.classList.contains('time-in')) return;
  const t = normTime(el.value);
  if (t === null) el.setAttribute('aria-invalid', 'true');
  else { el.removeAttribute('aria-invalid'); el.value = t; }
});
window.addEventListener('storage', ev => { if (ev.key === DATA_KEY && loadData()) render(); });
window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); installEvt = ev; if (UI.view === 'settings') render(); });

/* ================= boot ================= */
if (!loadData()) { Object.assign(S, demoData()); saveData(); }
const hashView = (location.hash || '').replace('#', '');
UI.view = VIEWS[hashView] ? hashView : (VIEWS[prefs.view] ? prefs.view : 'today');
render();
setTimeout(() => maybeSlot(true), 900);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
function tick() {
  const t = ymd(new Date());
  if (t !== TODAY) { TODAY = t; UI.sel = t; render(); }
  maybeSlot(false);
}
setInterval(tick, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); if (!layers.length) render(); } });
let lastMinute = nowHM();
setInterval(() => { const n = nowHM(); if (n !== lastMinute) { lastMinute = n; if (UI.view === 'today' && !layers.length) render(); } }, 60000);
})();
</script>
</body>
</html>
